# .github/workflows/generate-seo.yml
# 每次 push 到 main 分支时，自动生成 SEO 静态页面

name: Generate SEO Pages

on:
  push:
    branches:
      - main
    paths:
      - 'data/rescue/**'
      - 'scripts/generate_seo_pages.py'

jobs:
  generate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Run SEO page generator
        run: python3 scripts/generate_seo_pages.py

      - name: Commit and push generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add scene/ sitemap.xml
          git diff --staged --quiet || git commit -m "chore: auto-generate SEO pages [skip ci]"
          git push
