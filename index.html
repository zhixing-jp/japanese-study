<!doctype html>
<html lang="zh">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Japanese</title>
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N484C7TXZ0"></script>
<script>window.dataLayer=window.dataLayer||[];function gtag(){dataLayer.push(arguments);}gtag('js',new Date());gtag('config','G-N484C7TXZ0');</script>
<style>
/* ══════════════════════════════
   iOS 26 Design Tokens
══════════════════════════════ */
:root {
  /* surfaces */
  --bg:           #F2F2F7;
  --surface:      #FFFFFF;
  --surface2:     #F2F2F7;
  --glass:        rgba(242,242,247,0.88);
  --glass-dark:   rgba(28,28,30,0.80);
  /* text */
  --t1:           #1C1C1E;
  --t2:           #3A3A3C;
  --t3:           #636366;
  --t4:           #8E8E93;
  /* accent */
  --red:          #FF3B30;
  --red-bg:       rgba(255,59,48,0.10);
  --blue:         #007AFF;
  --blue-bg:      rgba(0,122,255,0.10);
  --green:        #34C759;
  --green-bg:     rgba(52,199,89,0.10);
  --yellow:       #FFD60A;
  --indigo:       #5856D6;
  /* divider */
  --line:         rgba(60,60,67,0.13);
  /* radius */
  --r-sm:         10px;
  --r-md:         14px;
  --r-lg:         20px;
  --r-xl:         28px;
  /* layout */
  --header-h:     140px; /* safe + title + scene bar row1 + row2 */
  --ctrl-h:       90px;
  --tab-h:        82px;
}

*,*::before,*::after { box-sizing:border-box; margin:0; padding:0; -webkit-tap-highlight-color:transparent; }
html { background:#E5E5EA; }

body {
  font-family: -apple-system, "SF Pro Text", "Hiragino Sans", "Noto Sans JP", "Noto Sans SC", sans-serif;
  background: var(--bg);
  color: var(--t1);
  -webkit-text-size-adjust: 100%;
  max-width: 430px;
  margin: 0 auto;
  min-height: 100dvh;
  overflow-x: hidden;
  position: relative;
}
@media(min-width:430px){
  body { box-shadow: 0 0 0 .5px rgba(0,0,0,.08), 0 8px 48px rgba(0,0,0,.14); }
}

/* ══════════════════════════════
   HEADER (fixed, glass)
══════════════════════════════ */
#header {
  position: fixed; top:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px; z-index:300;
  background: var(--glass);
  backdrop-filter: saturate(200%) blur(24px);
  -webkit-backdrop-filter: saturate(200%) blur(24px);
  border-bottom: .5px solid var(--line);
  padding-top: env(safe-area-inset-top);
}
.header-bar {
  height:52px; display:flex; align-items:center; padding:0 14px; gap:10px;
}
.wordmark {
  font-size:17px; font-weight:700; letter-spacing:-.4px;
  color:var(--t1); flex-shrink:0; display:flex; align-items:center; gap:5px;
}
.wordmark-dot {
  width:7px; height:7px; border-radius:50%; background:var(--red); flex-shrink:0;
}
.search-wrap { flex:1; position:relative; }
.search-wrap svg {
  position:absolute; left:9px; top:50%; transform:translateY(-50%);
  color:var(--t4); pointer-events:none;
}
#searchInput {
  width:100%; height:36px; padding:0 10px 0 32px;
  background:rgba(118,118,128,0.13); border:none; border-radius:12px;
  font-size:15px; color:var(--t1); outline:none; transition:background .15s;
}
#searchInput:focus { background:rgba(118,118,128,0.20); }
#searchInput::placeholder { color:var(--t4); }

/* scene bar wrapper */
#sceneBarWrap {
  border-bottom: .5px solid var(--line);
}
/* tag container: flex wrap, collapsed by default */
#sceneTagsWrap {
  display:flex; flex-wrap:wrap;
  padding:7px 14px 5px; gap:6px;
  max-height:80px;
  overflow:hidden;
  transition:max-height .32s cubic-bezier(.4,0,.2,1);
}
#sceneTagsWrap.expanded { max-height:600px; }
/* toggle button */
#sceneToggle {
  display:flex; align-items:center; justify-content:center;
  width:100%; height:22px; border:none; background:none;
  cursor:pointer; position:relative;
  -webkit-tap-highlight-color:transparent;
}
#sceneToggle::before,
#sceneToggle::after {
  content:''; position:absolute; top:50%;
  width:calc(50% - 18px); height:.5px;
  background:var(--line);
}
#sceneToggle::before { left:14px; }
#sceneToggle::after  { right:14px; }
.stoggle-arrow {
  font-size:22px; color:var(--t4); line-height:1;
  z-index:1; background:var(--bg); padding:0 6px;
}
.stag {
  flex-shrink:0; height:28px; padding:0 11px;
  border-radius:var(--r-lg); font-size:12px; font-weight:600;
  background:var(--surface); color:var(--t4);
  border:.5px solid var(--line);
  cursor:pointer; white-space:nowrap;
  transition:all .18s cubic-bezier(.34,1.56,.64,1);
  display:flex; align-items:center; gap:4px;
}
.stag:active { transform:scale(.92); }
.stag.on { background:var(--t1); color:#fff; border-color:var(--t1); }
.stag-icon { font-size:13px; }

/* ══════════════════════════════
   MAIN
══════════════════════════════ */
main {
  padding-top: var(--header-h);
  padding-bottom: calc(var(--ctrl-h) + var(--tab-h));
  min-height: 100dvh;
}

/* panels */
.panel { display:none; }
.panel.on { display:block; }

/* ══════════════════════════════
   BANNER (宣传区)
══════════════════════════════ */
#banner {
  margin:10px 14px 8px;
  background: linear-gradient(140deg,#1A1A2E 0%,#2C2C44 100%);
  border-radius:var(--r-xl); padding:12px 16px 11px;
  position:relative; overflow:hidden;
}
#banner::before {
  content:''; position:absolute; top:-20px; right:-20px;
  width:90px; height:90px; border-radius:50%;
  background:radial-gradient(circle,rgba(255,59,48,.20) 0%,transparent 70%);
  pointer-events:none;
}
.banner-inner {
  display:flex; align-items:center; justify-content:space-between; gap:10px;
}
.banner-left { flex:1; min-width:0; }
.banner-eyebrow {
  font-size:9px; font-weight:700; letter-spacing:.12em;
  text-transform:uppercase; color:rgba(255,255,255,.35); margin-bottom:3px;
}
.banner-title {
  font-size:17px; font-weight:400; letter-spacing:-.2px;
  color:var(--yellow); line-height:1.4; margin-bottom:7px;
}
.banner-pills { display:flex; gap:5px; flex-wrap:wrap; }
.banner-pill {
  font-size:10px; font-weight:600;
  color:rgba(255,255,255,.70);
  background:rgba(255,255,255,.09);
  border:1px solid rgba(255,255,255,.12);
  border-radius:20px; padding:3px 9px;
}
.banner-right {
  flex-shrink:0; text-align:center;
}
.banner-stat-num {
  font-size:22px; font-weight:700; color:var(--yellow);
  letter-spacing:-.5px; line-height:1;
}
.banner-stat-label {
  font-size:9px; color:rgba(255,255,255,.40);
  font-weight:600; letter-spacing:.06em; margin-top:2px;
}

/* ══════════════════════════════
   CONTENT AREA
══════════════════════════════ */
.content-wrap { padding:4px 14px 8px; }

/* section */
.sec-block { margin-bottom:22px; scroll-margin-top:104px; }
.sec-head { display:flex; align-items:flex-start; gap:10px; margin-bottom:10px; }
.sec-stripe {
  width:3px; min-height:46px; background:var(--red);
  border-radius:2px; flex-shrink:0; margin-top:2px;
}
.sec-meta { flex:1; }
.sec-eyebrow {
  font-size:10px; font-weight:700; letter-spacing:.10em;
  color:var(--red); text-transform:uppercase; margin-bottom:1px;
}
.sec-ja { font-size:18px; font-weight:700; letter-spacing:-.2px; line-height:1.3; }
.sec-zh { font-size:12px; color:var(--t4); margin-bottom:2px; }
.sec-desc { font-size:11px; color:var(--t4); font-style:italic; margin-bottom:3px; }
.sec-prog-row { display:flex; align-items:center; gap:7px; margin-top:4px; }
.sec-prog-text { font-size:11px; color:var(--t4); }
.prog-track { flex:1; max-width:90px; height:3px; background:var(--line); border-radius:2px; overflow:hidden; }
.prog-fill { height:100%; background:var(--red); border-radius:2px; transition:width .35s; }

.sec-btns { display:flex; gap:6px; flex-wrap:wrap; margin-bottom:8px; padding-left:13px; }

/* filter toggle */
.ftoggle {
  display:inline-flex; align-items:center; gap:5px;
  font-size:11px; color:var(--t4); cursor:pointer;
  padding:3px 10px; border-radius:20px;
  border:.5px solid var(--line); background:var(--surface);
  transition:all .15s;
}
.ftoggle.on { background:var(--blue-bg); border-color:var(--blue); color:var(--blue); font-weight:700; }
.ftdot {
  width:13px; height:13px; border-radius:50%;
  border:.5px solid var(--line); background:var(--surface);
  display:flex; align-items:center; justify-content:center;
  font-size:8px; transition:all .15s;
}
.ftoggle.on .ftdot { background:var(--blue); border-color:var(--blue); color:#fff; }

/* card */
.card {
  background:var(--surface); border-radius:var(--r-md);
  padding:14px 14px 11px; margin-bottom:8px;
  border-left:3px solid transparent;
  box-shadow:0 1px 0 rgba(0,0,0,.06);
  transition:border-left-color .15s, box-shadow .2s, transform .12s;
  position:relative;
}
.card:active { transform:scale(.99); }
.card.playing {
  border-left-color:var(--red); background:var(--red-bg);
  box-shadow:0 4px 18px rgba(255,59,48,.14);
}
.card.done { border-left-color:var(--green); background:var(--green-bg); opacity:.72; }
.card-num { font-size:10px; color:var(--t4); font-weight:600; margin-bottom:4px; }

.jp { font-size:22px; font-weight:700; letter-spacing:-.2px; line-height:1.9; margin-bottom:3px; }
.jp ruby { ruby-align:center; }
.jp rt { font-size:9px; font-weight:400; color:var(--t4); }
body.no-ruby rt { visibility:hidden; }

.zh { font-size:14px; color:var(--t3); margin-bottom:10px; }
.card-btns { display:flex; gap:6px; flex-wrap:wrap; align-items:center; }

/* complete banner */
.done-banner {
  background:var(--green-bg); border:.5px solid rgba(52,199,89,.3);
  border-radius:var(--r-md); padding:16px; text-align:center; margin-bottom:8px;
}
.done-banner-em { font-size:28px; margin-bottom:6px; }
.done-banner-txt { font-size:14px; font-weight:700; color:var(--green); margin-bottom:10px; }

/* search */
.srch-header {
  font-size:12px; color:var(--t4); margin-bottom:12px;
  padding-bottom:8px; border-bottom:.5px solid var(--line);
}
.srch-sec {
  font-size:10px; font-weight:700; color:var(--red);
  letter-spacing:.08em; text-transform:uppercase; margin:14px 0 5px;
}
mark { background:#FFD60A; color:var(--t1); border-radius:2px; padding:0 1px; }

/* ══════════════════════════════
   BUTTONS (iOS style)
══════════════════════════════ */
.btn {
  display:inline-flex; align-items:center; justify-content:center; gap:4px;
  font-size:13px; font-weight:600; border-radius:var(--r-sm);
  border:none; padding:7px 13px; min-height:32px;
  background:rgba(118,118,128,0.13); color:var(--t2);
  cursor:pointer; white-space:nowrap; letter-spacing:-.1px;
  transition:background .12s, transform .08s, color .12s, box-shadow .12s;
}
.btn:active { transform:scale(.93); }
.btn.dk { background:var(--t1); color:#fff; }
.btn.dk:active { background:var(--t2); }
.btn.rd { background:var(--red-bg); color:var(--red); }
.btn.bl { background:var(--blue-bg); color:var(--blue); }
.btn.on { background:var(--t1); color:#fff; }
.btn.sm { font-size:12px; padding:5px 10px; min-height:28px; border-radius:9px; }
.btn.stopped { background:var(--red); color:#fff; }

/* segmented control (iOS style) */
.seg {
  display:inline-flex;
  background:rgba(118,118,128,0.13);
  border-radius:var(--r-sm); padding:2px; gap:1px;
}
.seg .btn {
  background:transparent; border-radius:8px;
  font-size:12px; padding:5px 9px; min-height:28px;
  color:var(--t2);
}
.seg .btn.on {
  background:var(--surface); color:var(--t1);
  box-shadow:0 1px 3px rgba(0,0,0,.12), 0 1px 1px rgba(0,0,0,.06);
}

/* learned button */
.lbtn {
  margin-left:auto; flex-shrink:0;
  display:inline-flex; align-items:center; gap:3px;
  font-size:12px; font-weight:600; padding:5px 11px; min-height:28px;
  border-radius:20px; border:none;
  background:rgba(118,118,128,0.13); color:var(--t4); cursor:pointer;
  transition:all .15s;
}
.lbtn:active { transform:scale(.90); }
.lbtn.on { background:var(--green); color:#fff; }

/* ══════════════════════════════
   CONTROLS BAR (fixed bottom, above tabs)
══════════════════════════════ */
#ctrlBar {
  position:fixed; bottom:var(--tab-h); left:50%; transform:translateX(-50%);
  width:100%; max-width:430px; z-index:200;
  background: rgba(22,22,24,0.94);
  backdrop-filter:saturate(180%) blur(24px);
  -webkit-backdrop-filter:saturate(180%) blur(24px);
  border-top:.5px solid rgba(255,255,255,.10);
  padding:10px 14px 10px;
  display:flex; flex-direction:column; gap:8px;
}
/* row 1: main actions */
.ctrl-main {
  display:flex; align-items:center; gap:8px;
}
.ctrl-play {
  flex:1; height:40px; border-radius:var(--r-md);
  background:var(--t1); color:#fff;
  border:none; font-size:15px; font-weight:700;
  cursor:pointer; display:flex; align-items:center; justify-content:center; gap:6px;
  transition:background .12s, transform .08s;
  letter-spacing:-.1px;
}
.ctrl-play:active { transform:scale(.96); background:var(--t2); }
.ctrl-icon {
  width:40px; height:40px; border-radius:var(--r-md);
  background:rgba(255,255,255,0.12); color:rgba(255,255,255,.85);
  border:none; font-size:16px; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  transition:background .12s, transform .08s, color .12s;
}
.ctrl-icon:active { transform:scale(.90); }
.ctrl-icon.on { background:rgba(0,122,255,.35); color:#5AC8FA; }
.ctrl-icon.rd { background:rgba(255,59,48,.25); color:#FF6B6B; }
.ctrl-icon.stopped { background:var(--red); color:#fff; }
/* seg inside dark ctrl bar */
#ctrlBar .seg {
  background:rgba(255,255,255,0.10);
}
#ctrlBar .seg .btn { color:rgba(255,255,255,.60); }
#ctrlBar .seg .btn.on {
  background:rgba(255,255,255,0.20); color:#fff;
  box-shadow:0 1px 3px rgba(0,0,0,.3);
}

/* row 2: settings */
.ctrl-settings {
  display:flex; align-items:center; gap:6px; flex-wrap:wrap;
}

/* ══════════════════════════════
   TAB BAR (fixed, iOS style)
══════════════════════════════ */
#tabBar {
  position:fixed; bottom:0; left:50%; transform:translateX(-50%);
  width:100%; max-width:430px; z-index:300;
  background:var(--glass);
  backdrop-filter:saturate(200%) blur(24px);
  -webkit-backdrop-filter:saturate(200%) blur(24px);
  border-top:.5px solid var(--line);
  display:flex; align-items:flex-start; padding-top:10px;
  padding-bottom:env(safe-area-inset-bottom);
}
.tab {
  flex:1; display:flex; flex-direction:column; align-items:center; gap:3px;
  cursor:pointer; border:none; background:none; padding:0;
  color:var(--t4); font-size:10px; font-weight:500; letter-spacing:.01em;
  transition:color .15s; position:relative;
}
.tab.on { color:var(--red); }
.tab-icon {
  width:28px; height:28px; border-radius:9px;
  display:flex; align-items:center; justify-content:center;
  transition:background .15s, transform .12s;
  font-size:18px;
}
.tab.on .tab-icon { background:var(--red-bg); transform:scale(1.10); }
.tab:active .tab-icon { transform:scale(.86); }

/* ══════════════════════════════
   PLACEHOLDER PANELS
══════════════════════════════ */
.ph {
  padding:70px 28px 40px;
  text-align:center; display:flex; flex-direction:column; align-items:center; gap:10px;
}
.ph-icon { font-size:52px; line-height:1; }
.ph-title { font-size:20px; font-weight:700; letter-spacing:-.2px; color:var(--t1); }
.ph-desc { font-size:14px; color:var(--t4); line-height:1.7; max-width:260px; }
.ph-badge {
  margin-top:6px; display:inline-block;
  background:var(--t1); color:#fff;
  font-size:11px; font-weight:700; padding:6px 16px;
  border-radius:20px; letter-spacing:.04em;
}

/* ══════════════════════════════
   BACK TO TOP
══════════════════════════════ */
#backTop {
  position:fixed; bottom:calc(var(--tab-h) + var(--ctrl-h) + 12px); right:16px;
  width:36px; height:36px; border-radius:50%;
  background:var(--glass-dark);
  backdrop-filter:blur(12px); -webkit-backdrop-filter:blur(12px);
  color:#fff; border:none; cursor:pointer;
  display:flex; align-items:center; justify-content:center;
  box-shadow:0 2px 14px rgba(0,0,0,.22);
  opacity:0; transform:translateY(8px) scale(.8);
  transition:opacity .2s, transform .2s; z-index:90;
}
#backTop.on { opacity:1; transform:translateY(0) scale(1); }

/* ══════════════════════════════
   TOAST
══════════════════════════════ */
#toast {
  position:fixed; bottom:calc(var(--tab-h) + var(--ctrl-h) + 14px); left:50%;
  transform:translateX(-50%) translateY(8px);
  background:var(--glass-dark);
  backdrop-filter:blur(16px); -webkit-backdrop-filter:blur(16px);
  color:#fff; font-size:13px; font-weight:600;
  padding:9px 18px; border-radius:22px;
  opacity:0; transition:opacity .2s, transform .2s;
  pointer-events:none; z-index:400; white-space:nowrap; max-width:360px;
}
#toast.on { opacity:1; transform:translateX(-50%) translateY(0); }

#loading { text-align:center; padding:60px 20px; color:var(--t4); font-size:14px; }
</style>
</head>
<body>

<!-- ══ HEADER ══ -->
<div id="header">
  <div class="header-bar">
    <div class="wordmark" id="wordmark">
      <span id="siteTitle">Living Japanese</span>
      <div class="wordmark-dot"></div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="search" autocomplete="off">
    </div>
  </div>
  <div id="sceneBarWrap">
    <div id="sceneTagsWrap"></div>
    <button id="sceneToggle" onclick="toggleSceneBar()">
      <span class="stoggle-arrow" id="stoggleArrow">▼</span>
    </button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<main>

  <!-- Panel: 急救语句 -->
  <div class="panel on" id="panel-sos">
    <div id="banner"></div>
    <div class="content-wrap">
      <div id="loading">加载中…</div>
      <div id="content"></div>
    </div>
  </div>

  <!-- Panel: 日语学习 -->
  <div class="panel" id="panel-learn">
    <div class="ph">
      <div class="ph-icon">📖</div>
      <div class="ph-title" id="ph-learn-title">轻松日语学习</div>
      <div class="ph-desc">不是教科书，不考级。用真实场景让你在不知不觉中记住日语。每天一个情境，轻松学，马上用。</div>
      <span class="ph-badge">即将上线</span>
    </div>
  </div>

  <!-- Panel: 就医指南 -->
  <div class="panel" id="panel-medical">
    <div class="ph">
      <div class="ph-icon">🏥</div>
      <div class="ph-title">日本就医流程指南</div>
      <div class="ph-desc">从找医院到取药，图文并茂一步一步带你走。2026实用版，专为在日华人设计。</div>
      <span class="ph-badge">即将上线</span>
    </div>
  </div>

  <!-- Panel: 社区 -->
  <div class="panel" id="panel-community">
    <div class="ph">
      <div class="ph-icon">💬</div>
      <div class="ph-title">在日华人社区</div>
      <div class="ph-desc">分享经验，互相帮助。在日生活遇到的问题，这里都有人懂你。</div>
      <span class="ph-badge">敬请期待</span>
    </div>
  </div>

</main>

<!-- ══ CONTROLS BAR (fixed bottom) ══ -->
<div id="ctrlBar" style="display:none">
  <div class="ctrl-main">
    <button class="ctrl-play" id="btnPlay" onclick="speakAll()">▶ 朗读</button>
    <button class="ctrl-icon" id="btnPause" onclick="pauseOrResume()" title="暂停/继续">⏸</button>
    <button class="ctrl-icon rd" id="btnStop" onclick="stopSpeech()" title="停止">■</button>
    <button class="ctrl-icon" id="btnLoop" onclick="toggleLoop()" title="循环">🔁</button>
    <button class="ctrl-icon" id="btnRuby" onclick="toggleRuby()" title="注音显示切换" style="font-size:11px;font-weight:700">注音</button>
    <button class="ctrl-icon" onclick="showAll()" title="显示全部" style="font-size:11px;font-weight:700">全部</button>
  </div>
  <div class="ctrl-settings" id="ctrlSettings">
    <!-- 由JS根据config渲染 -->
  </div>
</div>

<!-- ══ TAB BAR ══ -->
<nav id="tabBar"></nav>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<div id="toast"></div>

<script>
/* ══════════════════════════════════════
   STATE
══════════════════════════════════════ */
let CFG = {}, ICONS = {}, SECTIONS = [];
let flat=[], checkedItems={}, filterUnlearned={};
let currentSection=-1, prevSection=-1, currentTab='sos';
let shouldStop=false, loopMode=false, speakSession=0;
let rubyOn=true, currentMode='jp', currentRate='0.75';
let jaVoice=null, zhVoice=null;

/* ══════════════════════════════════════
   BOOT — load all JSON then render
══════════════════════════════════════ */
async function boot(){
  loadStorage();
  try {
    const [cfg, icons, sosData] = await Promise.all([
      fetch('config.json').then(r=>r.json()),
      fetch('data/scene_icons.json').then(r=>r.json()),
      fetch('data/sentences_core.json').then(r=>r.json()),
    ]);
    CFG   = cfg;
    ICONS = icons;
    SECTIONS = sosData.sections;

    // apply config defaults
    currentMode = CFG.controls?.defaultMode || 'jp';
    currentRate = CFG.controls?.defaultRate || '0.75';

    // sort sections by priority
    const order = CFG.sceneBar?.priorityOrder || [];
    SECTIONS.sort((a,b)=>{
      const ia=order.indexOf(a.title), ib=order.indexOf(b.title);
      if(ia===-1&&ib===-1) return 0;
      if(ia===-1) return 1; if(ib===-1) return -1;
      return ia-ib;
    });

    buildFlat();
    renderSiteTitle();
    renderBanner();
    renderTabBar();
    renderCtrlSettings();
    renderSceneBar();
    renderContent(currentSection>=0&&currentSection<SECTIONS.length?currentSection:-1);
    document.getElementById('loading').style.display='none';
    document.getElementById('ctrlBar').style.display='';
    updateSearchPlaceholder();
    // 动态计算header高度，不依赖固定变量
    setTimeout(()=>{
      const hdr=document.getElementById('header');
      document.querySelector('main').style.paddingTop=hdr.offsetHeight+'px';
    },100);
    initVoices();
  } catch(e){
    document.getElementById('loading').textContent='加载失败，请检查配置文件。';
    console.error(e);
  }
}

/* ══════════════════════════════════════
   RENDER FROM CONFIG
══════════════════════════════════════ */
function renderSiteTitle(){
  const el=document.getElementById('siteTitle');
  if(el) el.textContent=CFG.site?.title||'Living Japanese';
  document.title=CFG.site?.title||'Living Japanese';
}

function renderBanner(){
  const b=CFG.banner||{};
  const totalSentences = SECTIONS.reduce((s,sec)=>s+sec.items.length,0);
  document.getElementById('banner').innerHTML=`
    <div class="banner-inner">
      <div class="banner-left">
        <div class="banner-eyebrow">${esc(b.eyebrow||'')}</div>
        <div class="banner-title">${esc(b.title||'')}</div>
        <div class="banner-pills">
          ${(b.pills||[]).map(p=>`<span class="banner-pill">${esc(p)}</span>`).join('')}
        </div>
      </div>
      <div class="banner-right">
        <div class="banner-stat-num">${totalSentences}</div>
        <div class="banner-stat-label">句・完全免费</div>
      </div>
    </div>`;
}

function renderTabBar(){
  const tabs=CFG.tabs||[];
  const tabIcons={shield:'🛡️',book:'📖',heart:'🏥',chat:'💬'};
  document.getElementById('tabBar').innerHTML=tabs.map(t=>`
    <button class="tab${currentTab===t.id?' on':''}" id="tab-${t.id}" onclick="switchTab('${t.id}')">
      <div class="tab-icon">${tabIcons[t.icon]||'●'}</div>
      ${esc(t.label)}
    </button>`).join('');
}

function renderCtrlSettings(){
  const c=CFG.controls||{};
  const modeHtml=`<div class="seg" id="modeGrp">
    ${(c.modes||[]).map(m=>`<button class="btn${currentMode===m.id?' on':''}" id="mode-${m.id}" onclick="setMode('${m.id}')">${esc(m.label)}</button>`).join('')}
  </div>`;
  const rateHtml=`<div class="seg" id="rateGrp">
    ${(c.rates||[]).map(r=>`<button class="btn${currentRate===r.id?' on':''}" id="rate-${r.id}" onclick="setRate('${r.id}')">${esc(r.label)}</button>`).join('')}
  </div>`;
  document.getElementById('ctrlSettings').innerHTML=modeHtml+rateHtml;
}

let sceneBarExpanded=false;

function renderSceneBar(){
  const wrap=document.getElementById('sceneTagsWrap');
  wrap.innerHTML='';

  const allBtn=document.createElement('button');
  allBtn.className='stag'+(currentSection===-1?' on':'');
  allBtn.id='stag-all'; allBtn.textContent='全部';
  allBtn.onclick=()=>showAll();
  wrap.appendChild(allBtn);

  SECTIONS.forEach((sec,si)=>{
    const icon=ICONS[sec.title]||'📖';
    const btn=document.createElement('button');
    btn.className='stag'+(currentSection===si?' on':'');
    btn.id='stag-'+si;
    btn.innerHTML=`<span class="stag-icon">${icon}</span>${esc(sec.title_zh||sec.title)}`;
    btn.onclick=()=>showSection(si);
    wrap.appendChild(btn);
  });
}

function updateSceneBar(si){
  document.querySelectorAll('.stag').forEach(t=>t.classList.remove('on'));
  const el=document.getElementById(si===-1?'stag-all':'stag-'+si);
  if(el) el.classList.add('on');
}

function toggleSceneBar(){
  sceneBarExpanded=!sceneBarExpanded;
  const wrap=document.getElementById('sceneTagsWrap');
  const arrow=document.getElementById('stoggleArrow');
  wrap.classList.toggle('expanded',sceneBarExpanded);
  arrow.textContent=sceneBarExpanded?'▲':'▼';
 // 等动画结束后再更新高度（动画时长320ms）
  setTimeout(()=>{
    const hdr=document.getElementById('header');
    document.querySelector('main').style.paddingTop=hdr.offsetHeight+'px';
  },350);
}

function updateSearchPlaceholder(){
  const ph=(CFG.search||{})[currentTab]||'搜索…';
  const el=document.getElementById('searchInput');
  if(el) el.placeholder=ph;
}

/* ══════════════════════════════════════
   TAB SWITCH
══════════════════════════════════════ */
function switchTab(name){
  currentTab=name;
  document.querySelectorAll('.panel').forEach(p=>p.classList.remove('on'));
  document.getElementById('panel-'+name).classList.add('on');
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('on'));
  const tb=document.getElementById('tab-'+name); if(tb)tb.classList.add('on');

  const isSos=name==='sos';
  document.getElementById('sceneBarWrap').style.display=isSos?'':'none';
  document.getElementById('searchWrap').style.display=isSos?'':'none';
  document.getElementById('ctrlBar').style.display=isSos?'':'none';
  document.querySelector('main').style.paddingBottom=
    isSos?`calc(var(--ctrl-h) + var(--tab-h))`:`var(--tab-h)`;
  // 动态header高度
  setTimeout(()=>{
    const hdr=document.getElementById('header');
    document.querySelector('main').style.paddingTop=hdr.offsetHeight+'px';
  },50);
  updateSearchPlaceholder();
  window.scrollTo({top:0,behavior:'smooth'});
  gtag('event','tab_switch',{tab:name});
}

/* ══════════════════════════════════════
   STORAGE
══════════════════════════════════════ */
function loadStorage(){
  try{checkedItems=JSON.parse(localStorage.getItem('lj_checked')||'{}');}catch(e){checkedItems={};}
  try{const s=localStorage.getItem('lj_sec');if(s!==null)currentSection=parseInt(s);}catch(e){}
}
function saveChecked(){try{localStorage.setItem('lj_checked',JSON.stringify(checkedItems));}catch(e){}}
function saveSec(si){try{localStorage.setItem('lj_sec',String(si));}catch(e){}}

function buildFlat(){
  flat=[];
  SECTIONS.forEach((sec,si)=>sec.items.forEach((item,ii)=>flat.push({si,ii,item})));
}

/* ══════════════════════════════════════
   RUBY
══════════════════════════════════════ */
function isKJ(ch){const c=ch.codePointAt(0);return(c>=0x4E00&&c<=0x9FFF)||(c>=0x3400&&c<=0x4DBF)||(c>=0xF900&&c<=0xFAFF)||c===0x3005;}
function rubyHtml(jp,fg){
  if(!fg||fg===jp)return esc(jp);
  const segs=[];let i=0;
  while(i<jp.length){
    if(isKJ(jp[i])){let k=i;while(k<jp.length&&isKJ(jp[k]))k++;segs.push({t:jp.slice(i,k),k:true});i=k;}
    else{let k=i;while(k<jp.length&&!isKJ(jp[k]))k++;segs.push({t:jp.slice(i,k),k:false});i=k;}
  }
  let fp=0,h='';
  for(let s=0;s<segs.length;s++){
    const sg=segs[s];
    if(!sg.k){const idx=fg.indexOf(sg.t,fp);if(idx!==-1)fp=idx+sg.t.length;h+=esc(sg.t);}
    else{
      let fe=fg.length;
      if(s+1<segs.length){const idx=fg.indexOf(segs[s+1].t,fp);if(idx!==-1)fe=idx;}
      const rd=fg.slice(fp,fe);fp=fe;
      h+=rd?`<ruby>${esc(sg.t)}<rt>${esc(rd)}</rt></ruby>`:esc(sg.t);
    }
  }
  return h;
}

/* ══════════════════════════════════════
   PROGRESS
══════════════════════════════════════ */
function getProg(si){
  const sec=SECTIONS[si],total=sec.items.length;
  const done=sec.items.filter((_,ii)=>checkedItems[`${si}-${ii}`]).length;
  return{done,total};
}

/* ══════════════════════════════════════
   RENDER CONTENT
══════════════════════════════════════ */
function renderContent(fsi){
  currentSection=fsi; saveSec(fsi);
  const wrap=document.getElementById('content');
  let gn=1; const nums=[];
  SECTIONS.forEach((sec,si)=>sec.items.forEach((_,ii)=>nums.push({si,ii,n:gn++})));

  const toShow=fsi===-1?SECTIONS.map((s,i)=>({sec:s,si:i})):[{sec:SECTIONS[fsi],si:fsi}];

  wrap.innerHTML=toShow.map(({sec,si})=>{
    const{done,total}=getProg(si);
    const pct=total?Math.round(done/total*100):0;
    const filtered=!!filterUnlearned[si];
    const allDone=done===total&&total>0;
    const visible=sec.items.filter((_,ii)=>!filtered||!checkedItems[`${si}-${ii}`]);

    const cards=visible.map(item=>{
      const ii=sec.items.indexOf(item);
      const n=(nums.find(x=>x.si===si&&x.ii===ii)||{}).n||'';
      const isDone=!!checkedItems[`${si}-${ii}`];
      return`<div class="card${isDone?' done':''}" id="card-${si}-${ii}">
        <div class="card-num">${n}</div>
        <div class="jp">${rubyHtml(item.jp,item.furigana)}</div>
        <div class="zh">${esc(item.zh)}</div>
        <div class="card-btns">
          <button class="btn sm" onclick="speakOne(${si},${ii})">▶ 朗读</button>
          <button class="btn sm" onclick="speakJp(${si},${ii})">▶ 仅日语</button>
          <button class="lbtn${isDone?' on':''}" onclick="toggleDone(${si},${ii})" id="lb-${si}-${ii}">
            ${isDone?'✓ 学会了':'学会了'}
          </button>
        </div>
      </div>`;
    }).join('');

    const nextSi=si+1<SECTIONS.length?si+1:-1;
    const doneBanner=allDone&&!filtered?`
      <div class="done-banner">
        <div class="done-banner-em">🎉</div>
        <div class="done-banner-txt">本章全部学完了！</div>
        ${nextSi>=0?`<button class="btn dk sm" onclick="showSection(${nextSi})">下一章 →</button>`:''}
      </div>`:'' ;

    return`<div class="sec-block" id="sec-${si}">
      <div class="sec-head">
        <div class="sec-stripe"></div>
        <div class="sec-meta">
          <div class="sec-eyebrow">${esc(sec.category)}</div>
          <div class="sec-ja">${esc(sec.title)}</div>
          <div class="sec-zh">${esc(sec.title_zh||'')}</div>
          ${sec.description?`<div class="sec-desc">${esc(sec.description)}</div>`:''}
          <div class="sec-prog-row">
            <span class="sec-prog-text" id="pt-${si}">${done} / ${total} 句</span>
            <div class="prog-track"><div class="prog-fill" id="pb-${si}" style="width:${pct}%"></div></div>
          </div>
        </div>
      </div>
      <div class="sec-btns">
        <button class="btn dk sm" onclick="speakSec(${si})">▶ 朗读本章</button>
        <button class="btn sm" id="lp-${si}" onclick="toggleLoopSec(${si})">🔁 循环</button>
        <button class="btn rd sm" onclick="stopSpeech()">■ 停止</button>
        <button class="ftoggle${filtered?' on':''}" onclick="toggleFilter(${si})" id="ft-${si}">
          <span class="ftdot">${filtered?'✓':''}</span>
          <span>${filtered?'只看未学（点击显示全部）':'只看未学'}</span>
        </button>
      </div>
      ${doneBanner}
      ${cards||'<p style="color:var(--t4);padding:10px 0;font-size:13px">🎉 全部已学完！</p>'}
    </div>`;
  }).join('');

  updateSceneBar(fsi);
}

function showSection(si){
  stopSpeech(); clearSrch(); renderContent(si);
  setTimeout(()=>{
    const el=document.querySelector('#content .sec-block');
    if(el){const h=document.getElementById('header').offsetHeight+8;
      window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-h,behavior:'smooth'});}
  },60);
  showToast(SECTIONS[si].title_zh||SECTIONS[si].title);
  gtag('event','view_section',{section_title:SECTIONS[si].title});
}

function showAll(){
  stopSpeech(); clearSrch();
  currentSection=-1; saveSec(-1);
  renderContent(-1); window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════════════════
   RUBY TOGGLE
══════════════════════════════════════ */
function toggleRuby(){
  rubyOn=!rubyOn;
  document.body.classList.toggle('no-ruby',!rubyOn);
  const btn=document.getElementById('btnRuby');
  if(btn){ btn.textContent=rubyOn?'注音':'注音'; btn.classList.toggle('on',!rubyOn); }
}

/* ══════════════════════════════════════
   MODE & RATE
══════════════════════════════════════ */
function setMode(m){
  currentMode=m;
  (CFG.controls?.modes||[]).forEach(x=>{
    const el=document.getElementById('mode-'+x.id);
    if(el)el.classList.toggle('on',x.id===m);
  });
}
function setRate(r){
  currentRate=r;
  (CFG.controls?.rates||[]).forEach(x=>{
    const el=document.getElementById('rate-'+x.id);
    if(el)el.classList.toggle('on',x.id===r);
  });
}

/* ══════════════════════════════════════
   FILTER
══════════════════════════════════════ */
function toggleFilter(si){
  filterUnlearned[si]=!filterUnlearned[si];
  renderContent(currentSection);
  setTimeout(()=>{
    const el=document.getElementById(`sec-${si}`);
    if(el){const h=document.getElementById('header').offsetHeight+8;
      window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-h,behavior:'smooth'});}
  },60);
}

/* ══════════════════════════════════════
   LEARNED / CHECK
══════════════════════════════════════ */
function toggleDone(si,ii){
  const key=`${si}-${ii}`;
  checkedItems[key]=!checkedItems[key];
  if(!checkedItems[key])delete checkedItems[key];
  saveChecked();
  const isDone=!!checkedItems[key], isFiltered=!!filterUnlearned[si];
  if(isFiltered&&isDone){
    const card=document.getElementById(`card-${si}-${ii}`);
    if(card){
      card.style.transition='opacity .3s,transform .3s';
      card.style.opacity='0'; card.style.transform='translateX(18px)';
      setTimeout(()=>{if(card.parentNode)card.parentNode.removeChild(card);
        updateProgUI(si);checkAllDone(si);},300);
    }
  } else if(isFiltered&&!isDone){
    renderContent(currentSection);
  } else {
    const card=document.getElementById(`card-${si}-${ii}`);
    const lb=document.getElementById(`lb-${si}-${ii}`);
    if(card)card.classList.toggle('done',isDone);
    if(lb){lb.classList.toggle('on',isDone);lb.textContent=isDone?'✓ 学会了':'学会了';}
    updateProgUI(si); checkAllDone(si);
  }
}
function updateProgUI(si){
  const{done,total}=getProg(si);
  const pct=total?Math.round(done/total*100):0;
  const pt=document.getElementById(`pt-${si}`);
  const pb=document.getElementById(`pb-${si}`);
  if(pt)pt.textContent=`${done} / ${total} 句`;
  if(pb)pb.style.width=pct+'%';
}
function checkAllDone(si){
  const{done,total}=getProg(si);
  if(done===total&&total>0)setTimeout(()=>renderContent(currentSection),350);
}

/* ══════════════════════════════════════
   SEARCH
══════════════════════════════════════ */
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.trim();
  if(!q){clearSearch();return;}
  prevSection=currentSection; doSearch(q);
});
function doSearch(q){
  stopSpeech();
  // 搜索时隐藏banner，全屏显示结果
  const banner=document.querySelector('#panel-sos #banner');
  if(banner)banner.style.display='none';
  const lower=q.toLowerCase(); let total=0,html='';
  SECTIONS.forEach((sec,si)=>{
    const hits=sec.items.filter(item=>
      item.jp.includes(q)||item.zh.includes(q)||
      (item.furigana&&item.furigana.includes(q))||item.zh.toLowerCase().includes(lower));
    if(!hits.length)return;
    total+=hits.length;
    html+=`<div class="srch-sec">${esc(sec.title_zh||sec.title)}</div>`;
    hits.forEach(item=>{
      const ii=sec.items.indexOf(item);
      html+=`<div class="card">
        <div class="jp">${hlTxt(item.jp,q)}</div>
        <div class="zh">${hlTxt(item.zh,q)}</div>
        <div class="card-btns">
          <button class="btn sm" onclick="speakOne(${si},${ii})">▶ 朗读</button>
          <button class="btn sm" onclick="speakJp(${si},${ii})">▶ 仅日语</button>
        </div>
      </div>`;
    });
  });
  document.getElementById('content').innerHTML=`
    <div class="srch-header">「${esc(q)}」的搜索结果：${total}句</div>
    ${html||'<p style="color:var(--t4);padding:20px 0;font-size:13px">没有找到相关句子。</p>'}`;
  updateSceneBar(-2);
}
function hlTxt(t,q){
  const e=esc(t),eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(eq,'gi'),m=>`<mark>${m}</mark>`);
}
function clearSrch(){
  document.getElementById('searchInput').value='';
  const banner=document.querySelector('#panel-sos #banner');
  if(banner)banner.style.display='';
}
function clearSearch(){
  clearSrch(); renderContent(prevSection);
  window.scrollTo({top:0,behavior:'smooth'});
}

/* ══════════════════════════════════════
   SPEECH
══════════════════════════════════════ */
function initVoices(){
  const v=window.speechSynthesis.getVoices(); if(!v.length)return;
  for(const n of['Kyoko','Otoya','O-ren','Hattori']){jaVoice=v.find(x=>x.name.includes(n)&&x.lang.startsWith('ja'));if(jaVoice)break;}
  if(!jaVoice)jaVoice=v.find(x=>x.lang.startsWith('ja'));
  for(const n of['Ting-Ting','Sin-ji','Mei-Jia','Tian-Tian']){zhVoice=v.find(x=>x.name.includes(n));if(zhVoice)break;}
  if(!zhVoice)zhVoice=v.find(x=>x.lang.startsWith('zh')&&!x.lang.startsWith('ja'));
}
window.speechSynthesis.onvoiceschanged=initVoices;

function getTxts(item){
  if(currentMode==='jp')return[{t:item.jp,l:'ja-JP',v:jaVoice}];
  if(currentMode==='jp_zh')return[{t:item.jp,l:'ja-JP',v:jaVoice},{t:item.zh,l:'zh-CN',v:zhVoice}];
  return[{t:item.jp,l:'ja-JP',v:jaVoice},{t:item.zh,l:'zh-CN',v:zhVoice},{t:item.jp,l:'ja-JP',v:jaVoice}];
}
function getSpeakable(si){
  const sec=SECTIONS[si],filt=!!filterUnlearned[si];
  return sec.items.map((item,ii)=>({item,ii})).filter(({ii})=>!filt||!checkedItems[`${si}-${ii}`]);
}
function speak(segs,onEnd,session){
  window.speechSynthesis.cancel();
  setTimeout(()=>{
    let i=0;
    function next(){
      if(shouldStop||speakSession!==session)return;
      if(i>=segs.length){if(onEnd)onEnd();return;}
      const sg=segs[i++];
      const u=new SpeechSynthesisUtterance(sg.t);
      u.lang=sg.l; u.rate=parseFloat(currentRate); u.pitch=1;
      if(sg.v)u.voice=sg.v;
      u.onend=()=>setTimeout(next,350); u.onerror=()=>setTimeout(next,100);
      window.speechSynthesis.speak(u);
    }
    next();
  },80);
}
function hlCard(si,ii){
  document.querySelectorAll('.card.playing').forEach(el=>el.classList.remove('playing'));
  const el=document.getElementById(`card-${si}-${ii}`);
  if(el){el.classList.add('playing');el.scrollIntoView({behavior:'smooth',block:'center'});}
}
function speakOne(si,ii){shouldStop=false;speakSession++;const s=speakSession;hlCard(si,ii);speak(getTxts(SECTIONS[si].items[ii]),null,s);}
function speakJp(si,ii){shouldStop=false;speakSession++;const s=speakSession;hlCard(si,ii);speak([{t:SECTIONS[si].items[ii].jp,l:'ja-JP',v:jaVoice}],null,s);}

function speakSec(si){
  shouldStop=false;speakSession++;const session=speakSession;
  const items=getSpeakable(si);
  if(!items.length){showToast('没有未学的句子了 🎉',2000);return;}
  speakSecItems(si,items,0,session);
}
function speakSecItems(si,items,idx,session){
  if(shouldStop||speakSession!==session)return;
  if(idx>=items.length){
    document.querySelectorAll('.card.playing').forEach(el=>el.classList.remove('playing'));
    if(loopMode){showToast('🔁 循环播放中…',1500);setTimeout(()=>{if(!shouldStop&&speakSession===session)speakSecItems(si,getSpeakable(si),0,session);},800);}
    else showToast('✓ 朗读完毕',2200);
    return;
  }
  const{item,ii}=items[idx];
  hlCard(si,ii);
  speak(getTxts(item),()=>setTimeout(()=>speakSecItems(si,items,idx+1,session),450),session);
}
function speakAll(){
  shouldStop=false;speakSession++;const session=speakSession;
  showToast('开始朗读…');
  let list=[];
  SECTIONS.forEach((sec,si)=>{
    if(currentSection!==-1&&si!==currentSection)return;
    getSpeakable(si).forEach(({item,ii})=>list.push({si,ii,item}));
  });
  if(!list.length){showToast('没有未学的句子了 🎉',2000);return;}
  speakList(list,0,session);
}
function speakList(list,idx,session){
  if(shouldStop||speakSession!==session)return;
  if(idx>=list.length){document.querySelectorAll('.card.playing').forEach(el=>el.classList.remove('playing'));showToast('✓ 全部朗读完毕',2200);return;}
  const{si,ii,item}=list[idx];
  hlCard(si,ii);
  speak(getTxts(item),()=>setTimeout(()=>speakList(list,idx+1,session),450),session);
}
function toggleLoop(){
  loopMode=!loopMode;
  const btn=document.getElementById('btnLoop');
  if(btn){btn.classList.toggle('on',loopMode);btn.textContent=loopMode?'🔁':'🔁';}
  showToast(loopMode?'循环播放已开启':'循环播放已关闭',1500);
}
function toggleLoopSec(si){
  const btn=document.getElementById(`lp-${si}`);
  const isOn=btn?.classList.contains('on');
  document.querySelectorAll('[id^="lp-"]').forEach(el=>{el.classList.remove('on');el.textContent='🔁 循环';});
  if(isOn){loopMode=false;stopSpeech();}
  else{
    loopMode=true; if(btn){btn.classList.add('on');btn.textContent='🔁 循环中';}
    const synth=window.speechSynthesis;
    if(!synth.speaking&&!synth.paused){
      shouldStop=false;speakSession++;const session=speakSession;
      const items=getSpeakable(si);
      if(!items.length){showToast('没有未学的句子了 🎉',2000);return;}
      speakSecItems(si,items,0,session);
    } else showToast('🔁 循环已开启，播完后自动重复',2000);
  }
}
function pauseOrResume(){
  const synth=window.speechSynthesis, btn=document.getElementById('btnPause');
  if(synth.speaking&&!synth.paused){synth.pause();if(btn){btn.textContent='▶';btn.classList.add('on');}}
  else if(synth.paused){synth.resume();if(btn){btn.textContent='⏸';btn.classList.remove('on');}}
}
function stopSpeech(){
  shouldStop=true;speakSession++;window.speechSynthesis.cancel();
  document.querySelectorAll('.card.playing').forEach(el=>el.classList.remove('playing'));
  const bp=document.getElementById('btnPause');
  if(bp){bp.textContent='⏸';bp.classList.remove('on');}
  if(loopMode){
    loopMode=false;
    const bl=document.getElementById('btnLoop');if(bl){bl.classList.remove('on');}
    document.querySelectorAll('[id^="lp-"]').forEach(el=>{el.classList.remove('on');el.textContent='🔁 循环';});
  }
  // 停止视觉反馈
  const bs=document.getElementById('btnStop');
  if(bs){bs.classList.add('stopped');setTimeout(()=>bs.classList.remove('stopped'),1200);}
}

/* ══════════════════════════════════════
   TOAST / SCROLL / UTILS
══════════════════════════════════════ */
let _tt=null;
function showToast(msg,ms=1800){
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('on');
  clearTimeout(_tt); _tt=setTimeout(()=>t.classList.remove('on'),ms);
}
window.addEventListener('scroll',()=>{
  document.getElementById('backTop').classList.toggle('on',window.scrollY>300);
});
document.addEventListener('visibilitychange',()=>{if(document.hidden)window.speechSynthesis.pause();});
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));}

boot();
</script>
