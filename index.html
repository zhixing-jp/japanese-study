<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>Living Japanese · 日活 | 在日华人日语急救包</title>
<meta name="description" content="专为在日华人设计的日语急救工具。18个生活场景，519句实用日语，完全免费。不用背，用时来查，10秒找到，说出来解决问题。">
<meta name="keywords" content="在日华人,日语急救,在日本生活,日语工具,生活日语,在日语言,日本生活,润日,日活">
<meta name="author" content="Living Japanese">
<meta name="robots" content="index, follow">
<meta property="og:title" content="Living Japanese · 日活 | 在日华人日语急救包">
<meta property="og:description" content="不会日语，也能在日本活得从容。18场景519句，完全免费。">
<meta property="og:url" content="https://livingjapanese.app">
<meta property="og:type" content="website">
<meta property="og:locale" content="zh_CN">

<script async src="https://www.googletagmanager.com/gtag/js?id=G-N484C7TXZ0"></script>
<script>
  window.dataLayer=window.dataLayer||[];
  function gtag(){dataLayer.push(arguments);}
  gtag('js',new Date()); gtag('config','G-N484C7TXZ0');
</script>

<link rel="stylesheet" href="css/base.css">
</head>
<body>

<!-- ══ HEADER ══ -->
<div id="header">
  <div class="header-bar">
    <div class="wordmark">
      <span id="siteTitle">Living Japanese</span>
      <div class="wordmark-dot"></div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="search" autocomplete="off">
    </div>
  </div>
  <div id="sceneBarWrap">
    <div id="sceneTagsWrap"></div>
    <button id="sceneToggle" onclick="toggleSceneBar()">
      <span class="stoggle-arrow" id="stoggleArrow">▼</span>
    </button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<main></main>

<!-- ══ SOS CONTROLS BAR ══ -->
<div id="ctrlBar" style="display:none">
  <div class="ctrl-main">
    <button class="ctrl-play" onclick="speakAll()">▶ 朗读</button>
    <button class="ctrl-icon" id="btnPause" onclick="pauseOrResume()">⏸</button>
    <button class="ctrl-icon rd" id="btnStop" onclick="stopSpeech()">■</button>
    <button class="ctrl-icon" id="btnLoop" onclick="toggleLoop()">🔁</button>
    <button class="ctrl-icon sm-text" id="btnRuby" onclick="toggleRuby()">注音</button>
    <button class="ctrl-icon sm-text" onclick="showAll()">全部</button>
  </div>
  <div class="ctrl-settings" id="ctrlSettings"></div>
</div>

<!-- ══ LEARN CONTROLS BAR ══ -->
<div id="learnCtrlBar">
  <button class="learn-play-btn" id="learnPlayBtn" onclick="learnPlay()">▶ 开始演练</button>
  <button class="learn-ctrl-icon" id="learnLoopBtn" onclick="learnToggleLoop()">🔁</button>
  <button class="learn-ctrl-icon rd" onclick="learnStop()">■</button>
</div>

<!-- ══ TAB BAR ══ -->
<nav id="tabBar"></nav>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<div id="toast"></div>

<!-- ══ JS ══ -->
<script src="js/base.js"></script>
<script>
/* ── Boot ── */
let CFG = {};
(async ()=>{
  try {
    CFG = await fetch('config.json').then(r=>r.json());
    const icons = await fetch('data/sos/scene_icons.json').then(r=>r.json());

    renderSiteTitle(CFG);
    renderPanels(CFG);
    renderTabBar(CFG);
    initVoices();

    await loadModules(CFG.modules||[]);
    await sosBoot(CFG, icons);
    await learnBoot();

    // 恢复上次的Tab
    const savedTab = localStorage.getItem('lj_tab');
    if(savedTab && savedTab !== 'sos'){
      switchTab(savedTab);
    }

    // 动态计算header高度
    setTimeout(()=>{
      const hdr = document.getElementById('header');
      if(hdr) document.querySelector('main').style.paddingTop = hdr.offsetHeight+'px';
    }, 100);

  } catch(e){
    console.error('Boot failed:', e);
    const el = document.querySelector('main');
    if(el) el.innerHTML =
      '<p style="padding:40px;text-align:center;color:#8E8E93">加载失败，请刷新重试。</p>';
  }
})();
</script>
</body>
</html>
