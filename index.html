<!doctype html>
<html lang="zh">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Living Japanese｜在日华人日语工具</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N484C7TXZ0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N484C7TXZ0');
  </script>

  <style>
    :root {
      --bg:         #F5F2ED;
      --surface:    #FFFFFF;
      --text:       #1C1C2E;
      --muted:      #8B7D6B;
      --line:       #E8E2D9;
      --accent:     #C23B35;
      --accent-bg:  #FBF0EF;
      --indigo:     #2D3561;
      --indigo-lt:  #EEF0F8;
      --green:      #10B981;
      --green-bg:   #F0FDF4;
      --tab-h:      60px;
      --header-h:   56px;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans",
                   "Yu Gothic UI", "Noto Sans JP", "Noto Sans SC", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
      /* 手机优先，桌面居中 */
      max-width: 480px;
      margin: 0 auto;
      min-height: 100vh;
      position: relative;
    }

    /* 桌面上给body加阴影，让手机版在桌面上更好看 */
    @media (min-width: 480px) {
      body {
        box-shadow: 0 0 40px rgba(0,0,0,.08);
      }
      html { background: #E8E4DD; }
    }

    /* ── HEADER ── */
    header {
      position: fixed;
      top: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: var(--header-h);
      z-index: 100;
      background: rgba(245,242,237,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
      display: flex;
      align-items: center;
      padding: 0 14px;
      gap: 10px;
    }

    .site-title {
      font-size: 17px;
      font-weight: 800;
      letter-spacing: .03em;
      color: var(--text);
      flex-shrink: 0;
    }

    .header-search {
      flex: 1;
      position: relative;
    }
    .header-search svg {
      position: absolute; left: 9px; top: 50%;
      transform: translateY(-50%);
      color: var(--muted); pointer-events: none;
    }
    #searchInput {
      width: 100%;
      padding: 7px 10px 7px 30px;
      border: 1.5px solid var(--line);
      border-radius: 20px;
      font-size: 14px;
      background: var(--surface);
      color: var(--text);
      outline: none;
      transition: border-color .15s;
    }
    #searchInput:focus { border-color: var(--accent); }
    #searchInput::placeholder { color: var(--muted); }

    /* ── MAIN ── */
    main {
      padding-top: var(--header-h);
      padding-bottom: var(--tab-h);
      min-height: 100vh;
    }

    /* ── PANELS ── */
    .panel { display: none; }
    .panel.active { display: block; }

    /* ── TAB BAR ── */
    .tab-bar {
      position: fixed;
      bottom: 0; left: 50%;
      transform: translateX(-50%);
      width: 100%; max-width: 480px;
      height: var(--tab-h);
      background: rgba(245,242,237,0.97);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-top: 1px solid var(--line);
      display: flex;
      align-items: stretch;
      z-index: 100;
      /* safe area for iPhone home bar */
      padding-bottom: env(safe-area-inset-bottom);
    }

    .tab-item {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 3px;
      cursor: pointer;
      border: none;
      background: none;
      padding: 6px 0;
      -webkit-tap-highlight-color: transparent;
      transition: color .12s;
      color: var(--muted);
      font-size: 10px;
      font-weight: 600;
      letter-spacing: .02em;
    }
    .tab-item svg { flex-shrink: 0; }
    .tab-item.active { color: var(--accent); }
    .tab-item:active { opacity: .7; }

    /* 激活指示条 */
    .tab-item.active::before {
      content: '';
      position: absolute;
      top: 0;
      width: 24px; height: 2px;
      background: var(--accent);
      border-radius: 0 0 2px 2px;
    }
    .tab-item { position: relative; }

    /* ── PANEL 1: 急救语句 ── */
    /* Hero */
    .hero {
      background: var(--indigo);
      padding: 18px 16px 14px;
      margin-bottom: 0;
    }
    .hero-sub {
      font-size: 13px;
      color: rgba(255,255,255,.6);
      margin-bottom: 2px;
    }
    .hero-title {
      font-size: 20px;
      font-weight: 400;
      color: #FCD34D;
      margin-bottom: 10px;
      line-height: 1.4;
    }
    .hero-lines {
      display: flex; flex-direction: column; gap: 4px;
      margin-bottom: 0;
    }
    .hero-line {
      font-size: 12px;
      color: rgba(255,255,255,.8);
      display: flex; align-items: center; gap: 7px;
    }
    .hero-line::before {
      content: '';
      width: 4px; height: 4px;
      border-radius: 50%;
      background: #FCD34D;
      flex-shrink: 0;
    }

    /* Scene picker */
    .scene-picker { padding: 14px 14px 4px; }
    .scene-picker-header {
      display: flex; align-items: center;
      justify-content: space-between;
      margin-bottom: 10px;
    }
    .scene-picker-title {
      font-size: 16px; font-weight: 800; color: var(--text);
    }
    .scene-count { font-size: 12px; color: var(--muted); }

    .scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 7px;
    }
    .scene-card {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 9px 5px 7px;
      text-align: center;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .scene-card:active { transform: scale(.95); }
    .scene-card:hover { background: var(--indigo-lt); border-color: var(--indigo); }
    .scene-card.active-scene { border-color: var(--accent); background: var(--accent-bg); }
    .scene-icon { font-size: 20px; margin-bottom: 3px; line-height: 1; }
    .scene-name-ja { font-size: 9px; color: var(--muted); line-height: 1.3; margin-bottom: 1px; }
    .scene-name-zh { font-size: 11px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .scene-prog-dot {
      position: absolute; top: 5px; right: 5px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); display: none;
    }
    .scene-prog-dot.show { display: block; }

    /* Content area */
    .content-area { padding: 10px 14px 0; }

    /* Section */
    .section-block { margin-bottom: 28px; scroll-margin-top: 20px; }
    .section-head {
      display: flex; align-items: flex-start; gap: 10px; margin-bottom: 8px;
    }
    .section-accent-bar {
      width: 3px; min-height: 40px; background: var(--accent);
      border-radius: 2px; flex-shrink: 0; margin-top: 3px;
    }
    .section-meta { flex: 1; }
    .section-cat {
      font-size: 9px; font-weight: 700; letter-spacing: .1em;
      color: var(--accent); text-transform: uppercase; margin-bottom: 1px;
    }
    .section-title-ja { font-size: 17px; font-weight: 800; line-height: 1.3; }
    .section-title-zh { font-size: 12px; color: var(--muted); margin-bottom: 2px; }
    .section-desc { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 3px; }
    .section-progress-wrap {
      display: flex; align-items: center; gap: 6px; margin-top: 3px;
    }
    .section-progress-text { font-size: 11px; color: var(--muted); }
    .progress-bar-wrap {
      flex: 1; max-width: 100px; height: 3px;
      background: var(--line); border-radius: 2px; overflow: hidden;
    }
    .progress-bar-fill {
      height: 100%; background: var(--accent);
      border-radius: 2px; transition: width .3s;
    }

    .section-btns {
      display: flex; gap: 6px; flex-wrap: wrap;
      margin-bottom: 8px; padding-left: 13px;
    }

    /* Filter toggle */
    .filter-toggle {
      display: inline-flex; align-items: center; gap: 5px;
      font-size: 11px; color: var(--muted);
      cursor: pointer; padding: 3px 9px;
      border-radius: 20px; border: 1.5px solid var(--line);
      background: var(--surface);
      -webkit-tap-highlight-color: transparent;
      transition: all .12s;
    }
    .filter-toggle.on {
      background: var(--indigo-lt); border-color: var(--indigo);
      color: var(--indigo); font-weight: 700;
    }
    .toggle-dot {
      width: 13px; height: 13px; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 8px; transition: all .12s;
    }
    .filter-toggle.on .toggle-dot {
      background: var(--indigo); border-color: var(--indigo); color: #fff;
    }

    /* Card */
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 13px; padding: 12px 12px 10px;
      margin-bottom: 7px; border-left: 3px solid transparent;
      transition: border-left-color .15s, box-shadow .15s;
      position: relative;
    }
    .card:hover { box-shadow: 0 2px 12px rgba(28,28,46,.07); }
    .card.speaking { border-left-color: var(--accent); background: var(--accent-bg); }
    .card.checked { border-left-color: var(--green); background: var(--green-bg); opacity: .75; }
    .card-num { font-size: 10px; color: var(--muted); font-weight: 600; margin-bottom: 3px; }

    .jp-text { font-size: 20px; font-weight: 700; letter-spacing: .02em; line-height: 1.9; margin-bottom: 2px; }
    .jp-text ruby { ruby-align: center; }
    .jp-text rt { font-size: 9px; font-weight: 400; color: var(--muted); }
    body.hide-ruby rt { visibility: hidden; }

    .zh-text { font-size: 14px; color: var(--muted); margin-bottom: 8px; }
    .card-actions { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }

    /* Buttons */
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 3px;
      font-size: 12px; font-weight: 600; border-radius: 8px;
      border: 1.5px solid var(--line); padding: 5px 9px;
      background: var(--surface); color: var(--text);
      cursor: pointer; white-space: nowrap; min-height: 30px;
      transition: background .12s, border-color .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .75; }
    .btn.primary { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .btn.danger { color: var(--accent); border-color: #F5C5C3; }
    .btn.danger:hover { background: var(--accent-bg); }
    .btn.toggled { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .btn.danger.stopped { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.mode-active { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .btn.sm { font-size: 11px; padding: 4px 8px; min-height: 26px; }

    /* Mode/Rate groups */
    .mode-group, .rate-group {
      display: flex; border: 1.5px solid var(--line);
      border-radius: 8px; overflow: hidden;
    }
    .mode-group .btn, .rate-group .btn {
      border: none; border-radius: 0;
      border-right: 1px solid var(--line);
      font-size: 11px; padding: 5px 7px; min-height: 30px;
    }
    .mode-group .btn:last-child,
    .rate-group .btn:last-child { border-right: none; }

    /* Learned button */
    .learned-btn {
      margin-left: auto; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 3px;
      font-size: 11px; font-weight: 600;
      padding: 4px 9px; min-height: 28px;
      border-radius: 20px; border: 1.5px solid var(--line);
      background: var(--surface); color: var(--muted);
      cursor: pointer;
      transition: all .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .learned-btn:hover { border-color: var(--green); color: var(--green); }
    .learned-btn.learned { background: var(--green); border-color: var(--green); color: #fff; }

    /* Complete banner */
    .complete-banner {
      background: var(--green-bg); border: 1.5px solid var(--green);
      border-radius: 13px; padding: 14px;
      text-align: center; margin-bottom: 7px;
    }
    .complete-banner-emoji { font-size: 26px; margin-bottom: 5px; }
    .complete-banner-text { font-size: 13px; font-weight: 700; color: var(--green); margin-bottom: 8px; }

    /* Search results */
    .search-header {
      font-size: 12px; color: var(--muted); margin-bottom: 12px;
      padding-bottom: 7px; border-bottom: 1px solid var(--line);
    }
    .search-section-label {
      font-size: 10px; font-weight: 700; color: var(--accent);
      letter-spacing: .08em; text-transform: uppercase;
      margin: 14px 0 5px;
    }
    mark { background: #FFF0B0; color: var(--text); border-radius: 2px; padding: 0 1px; }

    /* Controls bar（急救版块顶部控制）*/
    .controls-bar {
      display: flex; gap: 5px; flex-wrap: wrap;
      padding: 8px 14px;
      background: var(--bg);
      border-bottom: 1px solid var(--line);
    }

    /* ── PANEL 2: 日语学习 ── */
    .panel-placeholder {
      padding: 60px 24px;
      text-align: center;
    }
    .panel-placeholder .ph-icon { font-size: 48px; margin-bottom: 16px; }
    .panel-placeholder .ph-title {
      font-size: 18px; font-weight: 800; color: var(--text);
      margin-bottom: 8px;
    }
    .panel-placeholder .ph-desc {
      font-size: 14px; color: var(--muted); line-height: 1.7;
      margin-bottom: 20px;
    }
    .ph-badge {
      display: inline-block;
      background: var(--indigo); color: #fff;
      font-size: 11px; font-weight: 700;
      padding: 4px 12px; border-radius: 20px;
      letter-spacing: .06em;
    }

    /* ── PANEL 3: 就医指南 ── */
    /* 同 placeholder，后续填充 */

    /* ── PANEL 4: 社区 ── */
    /* 同 placeholder */

    /* ── BACK TO TOP ── */
    #backTop {
      position: fixed;
      bottom: calc(var(--tab-h) + 16px);
      right: 16px;
      width: 38px; height: 38px; border-radius: 50%;
      background: var(--indigo); color: #fff; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 3px 12px rgba(45,53,97,.3);
      opacity: 0; transform: translateY(6px);
      transition: opacity .2s, transform .2s; z-index: 90;
      -webkit-tap-highlight-color: transparent;
    }
    #backTop.visible { opacity: 1; transform: translateY(0); }

    /* ── TOAST ── */
    #toast {
      position: fixed;
      bottom: calc(var(--tab-h) + 16px);
      left: 50%; transform: translateX(-50%) translateY(6px);
      background: var(--text); color: #fff;
      font-size: 12px; font-weight: 600;
      padding: 7px 16px; border-radius: 20px;
      opacity: 0; transition: opacity .2s, transform .2s;
      pointer-events: none; z-index: 200; white-space: nowrap;
      max-width: calc(480px - 32px);
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #loading {
      text-align: center; padding: 60px 20px;
      color: var(--muted); font-size: 14px;
    }
  </style>
</head>
<body>

<!-- ── HEADER ── -->
<header>
  <span class="site-title">Living Japanese</span>
  <div class="header-search">
    <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
      <circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/>
    </svg>
    <input id="searchInput" type="search" placeholder="搜索日文或中文…" autocomplete="off">
  </div>
</header>

<!-- ── MAIN ── -->
<main>

  <!-- ╔══════════════════════╗ -->
  <!-- ║  PANEL 1: 急救语句   ║ -->
  <!-- ╚══════════════════════╝ -->
  <div class="panel active" id="panel-sos">

    <!-- Hero -->
    <div class="hero">
      <div class="hero-sub">在日本生活，</div>
      <div class="hero-title">语言是第一道墙。</div>
      <div class="hero-lines">
        <div class="hero-line">不用背，用的时候来查就好。</div>
        <div class="hero-line">10秒内找到，说出来，解决问题。</div>
      </div>
    </div>

    <!-- 控制栏 -->
    <div class="controls-bar">
      <button class="btn primary" onclick="speakAll()">▶ 朗读</button>
      <button class="btn" id="btnPause" onclick="pauseOrResume()">⏸</button>
      <button class="btn danger" id="btnStop" onclick="stopSpeech()">■ 停止</button>
      <button class="btn" id="btnLoop" onclick="toggleLoop()">🔁 循环</button>
      <button class="btn" id="btnRuby" onclick="toggleRuby()">振假名</button>
      <button class="btn" onclick="showAll()">全部</button>
      <div class="mode-group">
        <button class="btn mode-active" id="mode-jp" onclick="setMode('jp')">仅日语</button>
        <button class="btn" id="mode-jp_zh" onclick="setMode('jp_zh')">日→中</button>
        <button class="btn" id="mode-repeat" onclick="setMode('repeat')">日→中→日</button>
      </div>
      <div class="rate-group">
        <button class="btn" id="rate-0.9" onclick="setRate('0.9')">普通</button>
        <button class="btn mode-active" id="rate-0.75" onclick="setRate('0.75')">慢</button>
        <button class="btn" id="rate-0.6" onclick="setRate('0.6')">更慢</button>
      </div>
    </div>

    <!-- 今天去哪里 -->
    <div class="scene-picker">
      <div class="scene-picker-header">
        <span class="scene-picker-title">今天去哪里？</span>
        <span class="scene-count" id="totalCount"></span>
      </div>
      <div class="scene-grid" id="sceneGrid"></div>
    </div>

    <!-- 内容区 -->
    <div class="content-area" id="contentArea">
      <div id="loading">加载中…</div>
      <div id="content"></div>
    </div>

  </div><!-- /panel-sos -->

  <!-- ╔══════════════════════╗ -->
  <!-- ║  PANEL 2: 日语学习   ║ -->
  <!-- ╚══════════════════════╝ -->
  <div class="panel" id="panel-learn">
    <div class="panel-placeholder">
      <div class="ph-icon">📖</div>
      <div class="ph-title">轻松日语学习</div>
      <div class="ph-desc">
        不是教科书，不考级。<br>
        用真实场景和情境，<br>
        让你在不知不觉中记住日语。<br><br>
        每天一个场景，<br>
        轻松学，马上用。
      </div>
      <span class="ph-badge">即将上线</span>
    </div>
  </div>

  <!-- ╔══════════════════════╗ -->
  <!-- ║  PANEL 3: 就医指南   ║ -->
  <!-- ╚══════════════════════╝ -->
  <div class="panel" id="panel-medical">
    <div class="panel-placeholder">
      <div class="ph-icon">🏥</div>
      <div class="ph-title">日本就医流程指南</div>
      <div class="ph-desc">
        在日本生病不要慌。<br>
        从找医院到取药，<br>
        图文并茂，一步一步带你走。<br><br>
        2026实用版，专为在日华人设计。
      </div>
      <span class="ph-badge">即将上线</span>
    </div>
  </div>

  <!-- ╔══════════════════════╗ -->
  <!-- ║  PANEL 4: 社区       ║ -->
  <!-- ╚══════════════════════╝ -->
  <div class="panel" id="panel-community">
    <div class="panel-placeholder">
      <div class="ph-icon">💬</div>
      <div class="ph-title">在日华人社区</div>
      <div class="ph-desc">
        分享经验，互相帮助。<br>
        在日生活遇到的问题，<br>
        这里都有人懂你。<br><br>
        功能建设中，敬请期待。
      </div>
      <span class="ph-badge">敬请期待</span>
    </div>
  </div>

</main>

<!-- ── TAB BAR ── -->
<nav class="tab-bar">
  <button class="tab-item active" id="tab-sos" onclick="switchTab('sos')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M12 22s8-4 8-10V5l-8-3-8 3v7c0 6 8 10 8 10z"/>
    </svg>
    急救语句
  </button>
  <button class="tab-item" id="tab-learn" onclick="switchTab('learn')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M2 3h6a4 4 0 0 1 4 4v14a3 3 0 0 0-3-3H2z"/>
      <path d="M22 3h-6a4 4 0 0 0-4 4v14a3 3 0 0 1 3-3h7z"/>
    </svg>
    日语学习
  </button>
  <button class="tab-item" id="tab-medical" onclick="switchTab('medical')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M22 12h-4l-3 9L9 3l-3 9H2"/>
    </svg>
    就医指南
  </button>
  <button class="tab-item" id="tab-community" onclick="switchTab('community')">
    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8">
      <path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>
    </svg>
    社区
  </button>
</nav>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<div id="toast"></div>

<script>
// ── DATA ──
const DATA_FILES = ['data/sentences_core.json'];
const SCENE_ICONS = {
  '共通短句':'💬','入境・空港':'✈️','外出':'🗺️','買い物':'🛒',
  '飲食':'🍜','交通':'🚃','受診':'🏥','手続き':'📋',
  'お金':'🏦','住まい':'🏠','子供・学校':'🎒','仕事':'💼',
  'コンビニサービス':'🏪','生活サービス':'✂️','ネット購入・配送':'📦',
  '緊急':'🆘','電話':'📞','デジタル':'📱'
};

let allSections = [], flat = [];
let shouldStop = false, loopMode = false;
let speakSession = 0, sectionLoopSi = -1;
let rubyVisible = true;
let currentSection = -1, previousSection = -1;
let checkedItems = {}, filterUnlearned = {};
let currentMode = 'jp', currentRate = '0.75';
let jaVoice = null, zhVoice = null;

// ── TAB SWITCH ──
function switchTab(name) {
  document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.tab-item').forEach(t => t.classList.remove('active'));
  document.getElementById('panel-' + name).classList.add('active');
  document.getElementById('tab-' + name).classList.add('active');

  // 搜索框只在急救版块显示
  const searchWrap = document.querySelector('.header-search');
  searchWrap.style.display = name === 'sos' ? '' : 'none';

  window.scrollTo({top: 0, behavior: 'smooth'});
  gtag('event', 'tab_switch', {tab: name});
}

// ── VOICE ──
function initVoices() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const jaPrefs = ['Kyoko','Otoya','O-ren','Hattori'];
  for (const n of jaPrefs) {
    jaVoice = voices.find(v => v.name.includes(n) && v.lang.startsWith('ja'));
    if (jaVoice) break;
  }
  if (!jaVoice) jaVoice = voices.find(v => v.lang.startsWith('ja'));
  const zhPrefs = ['Ting-Ting','Sin-ji','Mei-Jia','Tian-Tian'];
  for (const n of zhPrefs) {
    zhVoice = voices.find(v => v.name.includes(n));
    if (zhVoice) break;
  }
  if (!zhVoice) zhVoice = voices.find(v => v.lang.startsWith('zh') && !v.lang.startsWith('ja'));
}
window.speechSynthesis.onvoiceschanged = initVoices;
initVoices();

// ── MODE & RATE ──
function setMode(m) {
  currentMode = m;
  ['jp','jp_zh','repeat'].forEach(k =>
    document.getElementById('mode-'+k).classList.toggle('mode-active', k === m));
}
function setRate(r) {
  currentRate = r;
  ['0.9','0.75','0.6'].forEach(k =>
    document.getElementById('rate-'+k).classList.toggle('mode-active', k === r));
}

// ── KANJI ──
function isKanji(ch) {
  const c = ch.codePointAt(0);
  return (c>=0x4E00&&c<=0x9FFF)||(c>=0x3400&&c<=0x4DBF)||(c>=0xF900&&c<=0xFAFF);
}
function buildRubyHtml(jp, furigana) {
  if (!furigana || furigana === jp) return esc(jp);
  const segs = [];
  let i = 0;
  while (i < jp.length) {
    if (isKanji(jp[i])) {
      let k=i; while(k<jp.length&&isKanji(jp[k]))k++;
      segs.push({text:jp.slice(i,k),kanji:true}); i=k;
    } else {
      let k=i; while(k<jp.length&&!isKanji(jp[k]))k++;
      segs.push({text:jp.slice(i,k),kanji:false}); i=k;
    }
  }
  let fPos=0, html='';
  for (let s=0;s<segs.length;s++) {
    const seg=segs[s];
    if (!seg.kanji) {
      const idx=furigana.indexOf(seg.text,fPos);
      if(idx!==-1) fPos=idx+seg.text.length;
      html+=esc(seg.text);
    } else {
      let fEnd=furigana.length;
      if(s+1<segs.length){const idx=furigana.indexOf(segs[s+1].text,fPos);if(idx!==-1)fEnd=idx;}
      const reading=furigana.slice(fPos,fEnd);
      fPos=fEnd;
      html+=reading?`<ruby>${esc(seg.text)}<rt>${esc(reading)}</rt></ruby>`:esc(seg.text);
    }
  }
  return html;
}

// ── STORAGE ──
function loadStorage() {
  try { checkedItems=JSON.parse(localStorage.getItem('lj_checked')||'{}'); } catch(e){checkedItems={};}
  try { const s=localStorage.getItem('lj_last_section'); if(s!==null)currentSection=parseInt(s); } catch(e){}
}
function saveChecked() { try{localStorage.setItem('lj_checked',JSON.stringify(checkedItems));}catch(e){} }
function saveLastSection(si) { try{localStorage.setItem('lj_last_section',String(si));}catch(e){} }

// ── LOAD DATA ──
async function loadData() {
  loadStorage();
  try {
    const results = await Promise.all(DATA_FILES.map(f=>fetch(f).then(r=>r.json())));
    results.forEach(d=>{ allSections=allSections.concat(d.sections); });
    buildFlat();
    renderSceneGrid();
    if (currentSection>=0&&currentSection<allSections.length) {
      renderContent(currentSection);
    } else {
      renderContent(-1);
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('totalCount').textContent=`共${allSections.length}个场景`;
  } catch(e) {
    document.getElementById('loading').textContent='加载失败，请检查 data/sentences_core.json';
  }
}

function buildFlat() {
  flat=[];
  allSections.forEach((sec,si)=>{
    sec.items.forEach((item,ii)=>flat.push({si,ii,item}));
  });
}

// ── SCENE GRID ──
function renderSceneGrid() {
  const grid=document.getElementById('sceneGrid');
  grid.innerHTML=allSections.map((sec,si)=>{
    const icon=SCENE_ICONS[sec.title]||'📖';
    const {done}=getSectionProgress(si);
    return `
      <div class="scene-card${currentSection===si?' active-scene':''}" onclick="showSection(${si})" id="sc-${si}">
        <div class="scene-prog-dot${done>0?' show':''}" id="sc-dot-${si}"></div>
        <div class="scene-icon">${icon}</div>
        <div class="scene-name-ja">${esc(sec.title)}</div>
        <div class="scene-name-zh">${esc(sec.title_zh||'')}</div>
      </div>`;
  }).join('');
}

function updateSceneCard(si) {
  const card=document.getElementById(`sc-${si}`);
  if(card) card.classList.toggle('active-scene',currentSection===si);
  const dot=document.getElementById(`sc-dot-${si}`);
  if(dot) dot.classList.toggle('show',getSectionProgress(si).done>0);
}

// ── PROGRESS ──
function getSectionProgress(si) {
  const sec=allSections[si];
  const total=sec.items.length;
  const done=sec.items.filter((_,ii)=>checkedItems[`${si}-${ii}`]).length;
  return {done,total};
}

// ── RENDER CONTENT ──
function renderContent(filterSi) {
  currentSection=filterSi;
  saveLastSection(filterSi);
  const content=document.getElementById('content');
  let globalNum=1;
  const nums=[];
  allSections.forEach((sec,si)=>{
    sec.items.forEach((_,ii)=>nums.push({si,ii,n:globalNum++}));
  });

  const toShow=filterSi===-1
    ?allSections.map((s,i)=>({sec:s,si:i}))
    :[{sec:allSections[filterSi],si:filterSi}];

  content.innerHTML=toShow.map(({sec,si})=>{
    const {done,total}=getSectionProgress(si);
    const pct=total?Math.round(done/total*100):0;
    const isFiltered=!!filterUnlearned[si];
    const allDone=done===total&&total>0;
    const itemsToShow=sec.items.filter((_,ii)=>!isFiltered||!checkedItems[`${si}-${ii}`]);

    const cards=itemsToShow.map((item)=>{
      const ii=sec.items.indexOf(item);
      const entry=nums.find(x=>x.si===si&&x.ii===ii);
      const n=entry?entry.n:'';
      const isChecked=!!checkedItems[`${si}-${ii}`];
      return `
        <div class="card${isChecked?' checked':''}" id="card-${si}-${ii}">
          <div class="card-num">${n}</div>
          <div class="jp-text">${buildRubyHtml(item.jp,item.furigana)}</div>
          <div class="zh-text">${esc(item.zh)}</div>
          <div class="card-actions">
            <button class="btn sm" onclick="speakItem(${si},${ii})">▶ 朗读</button>
            <button class="btn sm" onclick="speakJpOnly(${si},${ii})">▶ 仅日语</button>
            <button class="learned-btn${isChecked?' learned':''}" onclick="toggleCheck(${si},${ii})" id="chk-${si}-${ii}">
              ${isChecked?'✓ 学会了':'学会了'}
            </button>
          </div>
        </div>`;
    }).join('');

    const nextSi=si+1<allSections.length?si+1:-1;
    const completeBanner=allDone&&!isFiltered?`
      <div class="complete-banner">
        <div class="complete-banner-emoji">🎉</div>
        <div class="complete-banner-text">本章全部学完了！</div>
        ${nextSi>=0?`<button class="btn primary sm" onclick="showSection(${nextSi})">下一章 →</button>`:''}
      </div>`:'';

    return `
      <div class="section-block" id="section-${si}">
        <div class="section-head">
          <div class="section-accent-bar"></div>
          <div class="section-meta">
            <div class="section-cat">${esc(sec.category)}</div>
            <div class="section-title-ja">${esc(sec.title)}</div>
            <div class="section-title-zh">${esc(sec.title_zh||'')}</div>
            ${sec.description?`<div class="section-desc">${esc(sec.description)}</div>`:''}
            <div class="section-progress-wrap">
              <span class="section-progress-text" id="pt-${si}">${done} / ${total} 句</span>
              <div class="progress-bar-wrap">
                <div class="progress-bar-fill" id="pb-${si}" style="width:${pct}%"></div>
              </div>
            </div>
          </div>
        </div>
        <div class="section-btns">
          <button class="btn primary sm" onclick="speakSection(${si})">▶ 朗读本章</button>
          <button class="btn sm" id="btnLoop-${si}" onclick="toggleLoopSection(${si})">🔁 循环</button>
          <button class="btn danger sm" onclick="stopSpeech()">■ 停止</button>
          <button class="filter-toggle${isFiltered?' on':''}" onclick="toggleFilter(${si})" id="ft-${si}">
            <span class="toggle-dot">${isFiltered?'✓':''}</span>
            <span>${isFiltered?'只看未学（点击显示全部）':'只看未学'}</span>
          </button>
        </div>
        ${completeBanner}
        ${cards||'<p style="color:var(--muted);padding:10px 0;font-size:13px">🎉 全部已学完！</p>'}
      </div>`;
  }).join('');

  allSections.forEach((_,si)=>updateSceneCard(si));
}

// ── SHOW SECTION ──
function showSection(si) {
  stopSpeech();
  clearSearchUI();
  renderContent(si);
  setTimeout(()=>{
    const first=document.querySelector('#content .section-block');
    if(first){
      const hh=document.querySelector('header').offsetHeight+40;
      window.scrollTo({top:first.getBoundingClientRect().top+window.scrollY-hh,behavior:'smooth'});
    }
  },60);
  showToast(allSections[si].title_zh||allSections[si].title);
  gtag('event','view_section',{section_title:allSections[si].title});
}

function showAll() {
  stopSpeech(); clearSearchUI();
  currentSection=-1; saveLastSection(-1);
  renderContent(-1);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── RUBY ──
function toggleRuby() {
  rubyVisible=!rubyVisible;
  document.body.classList.toggle('hide-ruby',!rubyVisible);
  const btn=document.getElementById('btnRuby');
  btn.textContent=rubyVisible?'振假名':'振假名 关';
  btn.classList.toggle('toggled',!rubyVisible);
}

// ── FILTER ──
function toggleFilter(si) {
  filterUnlearned[si]=!filterUnlearned[si];
  renderContent(currentSection);
  setTimeout(()=>{
    const el=document.getElementById(`section-${si}`);
    if(el){
      const hh=document.querySelector('header').offsetHeight+8;
      window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-hh,behavior:'smooth'});
    }
  },60);
}

// ── CHECK ──
function toggleCheck(si,ii) {
  const key=`${si}-${ii}`;
  checkedItems[key]=!checkedItems[key];
  if(!checkedItems[key])delete checkedItems[key];
  saveChecked();
  const isChecked=!!checkedItems[key];
  const isFiltered=!!filterUnlearned[si];
  if(isFiltered&&isChecked){
    const card=document.getElementById(`card-${si}-${ii}`);
    if(card){
      card.style.transition='opacity .3s, transform .3s';
      card.style.opacity='0'; card.style.transform='translateX(20px)';
      setTimeout(()=>{
        if(card.parentNode)card.parentNode.removeChild(card);
        updateSectionProgress(si); updateSceneCard(si);
        const {done,total}=getSectionProgress(si);
        if(done===total&&total>0)setTimeout(()=>renderContent(currentSection),300);
      },300);
    }
  } else if(isFiltered&&!isChecked){
    renderContent(currentSection);
  } else {
    const card=document.getElementById(`card-${si}-${ii}`);
    const btn=document.getElementById(`chk-${si}-${ii}`);
    if(card)card.classList.toggle('checked',isChecked);
    if(btn){btn.classList.toggle('learned',isChecked);btn.textContent=isChecked?'✓ 学会了':'学会了';}
    updateSectionProgress(si); updateSceneCard(si);
    const {done,total}=getSectionProgress(si);
    if(done===total&&total>0)setTimeout(()=>renderContent(currentSection),300);
  }
}

function updateSectionProgress(si) {
  const {done,total}=getSectionProgress(si);
  const pct=total?Math.round(done/total*100):0;
  const pt=document.getElementById(`pt-${si}`);
  const pb=document.getElementById(`pb-${si}`);
  if(pt)pt.textContent=`${done} / ${total} 句`;
  if(pb)pb.style.width=pct+'%';
}

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.trim();
  if(!q){clearSearch();return;}
  previousSection=currentSection;
  doSearch(q);
});

function doSearch(q) {
  stopSpeech();
  const lower=q.toLowerCase();
  let total=0,html='';
  allSections.forEach((sec,si)=>{
    const hits=sec.items.filter(item=>
      item.jp.includes(q)||item.zh.includes(q)||
      (item.furigana&&item.furigana.includes(q))||
      item.zh.toLowerCase().includes(lower)
    );
    if(!hits.length)return;
    total+=hits.length;
    html+=`<div class="search-section-label">${esc(sec.title_zh||sec.title)}</div>`;
    hits.forEach(item=>{
      const ii=sec.items.indexOf(item);
      html+=`
        <div class="card">
          <div class="jp-text">${hlText(item.jp,q)}</div>
          <div class="zh-text">${hlText(item.zh,q)}</div>
          <div class="card-actions">
            <button class="btn sm" onclick="speakItem(${si},${ii})">▶ 朗读</button>
            <button class="btn sm" onclick="speakJpOnly(${si},${ii})">▶ 仅日语</button>
          </div>
        </div>`;
    });
  });
  document.getElementById('content').innerHTML=`
    <div class="search-header">「${esc(q)}」的搜索结果：${total}句</div>
    ${html||'<p style="color:var(--muted);padding:20px 0;font-size:13px">没有找到相关句子。</p>'}`;
}

function hlText(text,q){
  const e=esc(text);
  const eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(eq,'gi'),m=>`<mark>${m}</mark>`);
}

function clearSearchUI(){
  document.getElementById('searchInput').value='';
}
function clearSearch(){
  clearSearchUI();
  renderContent(previousSection);
  window.scrollTo({top:0,behavior:'smooth'});
}

// ── SPEECH ──
function getModeTexts(item){
  if(currentMode==='jp') return [{text:item.jp,lang:'ja-JP',voice:jaVoice}];
  if(currentMode==='jp_zh') return [
    {text:item.jp,lang:'ja-JP',voice:jaVoice},
    {text:item.zh,lang:'zh-CN',voice:zhVoice}
  ];
  return [
    {text:item.jp,lang:'ja-JP',voice:jaVoice},
    {text:item.zh,lang:'zh-CN',voice:zhVoice},
    {text:item.jp,lang:'ja-JP',voice:jaVoice}
  ];
}

function getSpeakItems(si){
  const sec=allSections[si];
  const isFiltered=!!filterUnlearned[si];
  return sec.items.map((item,ii)=>({item,ii})).filter(({ii})=>!isFiltered||!checkedItems[`${si}-${ii}`]);
}

function speakSegments(segs,onEnd,session){
  const synth=window.speechSynthesis;
  synth.cancel();
  setTimeout(()=>{
    let i=0;
    function next(){
      if(shouldStop||speakSession!==session)return;
      if(i>=segs.length){if(onEnd)onEnd();return;}
      const seg=segs[i++];
      const u=new SpeechSynthesisUtterance(seg.text);
      u.lang=seg.lang; u.rate=parseFloat(currentRate); u.pitch=1;
      if(seg.voice)u.voice=seg.voice;
      u.onend=()=>setTimeout(next,350);
      u.onerror=()=>setTimeout(next,100);
      synth.speak(u);
    }
    next();
  },80);
}

function highlightCard(si,ii){
  document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
  const el=document.getElementById(`card-${si}-${ii}`);
  if(el){el.classList.add('speaking');el.scrollIntoView({behavior:'smooth',block:'center'});}
}

function speakItem(si,ii){
  shouldStop=false; speakSession++;
  const session=speakSession;
  highlightCard(si,ii);
  speakSegments(getModeTexts(allSections[si].items[ii]),null,session);
}

function speakJpOnly(si,ii){
  shouldStop=false; speakSession++;
  const session=speakSession;
  highlightCard(si,ii);
  speakSegments([{text:allSections[si].items[ii].jp,lang:'ja-JP',voice:jaVoice}],null,session);
}

function speakSection(si){
  shouldStop=false; speakSession++;
  const session=speakSession;
  const items=getSpeakItems(si);
  if(!items.length){showToast('没有未学的句子了 🎉',2000);return;}
  speakSectionItems(si,items,0,session);
}

function speakSectionItems(si,items,idx,session){
  if(shouldStop||speakSession!==session)return;
  if(idx>=items.length){
    document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
    if(loopMode){
      showToast('🔁 循环播放中…',1500);
      setTimeout(()=>{
        if(!shouldStop&&speakSession===session){
          speakSectionItems(si,getSpeakItems(si),0,session);
        }
      },800);
    } else {
      showToast('✓ 朗读完毕',2200);
    }
    return;
  }
  const {item,ii}=items[idx];
  highlightCard(si,ii);
  speakSegments(getModeTexts(item),()=>{
    setTimeout(()=>speakSectionItems(si,items,idx+1,session),450);
  },session);
}

function speakAll(){
  shouldStop=false; speakSession++;
  const session=speakSession;
  showToast('开始朗读…');
  let list=[];
  allSections.forEach((sec,si)=>{
    if(currentSection!==-1&&si!==currentSection)return;
    getSpeakItems(si).forEach(({item,ii})=>list.push({si,ii,item}));
  });
  if(!list.length){showToast('没有未学的句子了 🎉',2000);return;}
  speakList_(list,0,session);
}

function speakList_(list,index,session){
  if(shouldStop||speakSession!==session)return;
  if(index>=list.length){
    document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
    showToast('✓ 全部朗读完毕',2200);
    return;
  }
  const {si,ii,item}=list[index];
  highlightCard(si,ii);
  speakSegments(getModeTexts(item),()=>setTimeout(()=>speakList_(list,index+1,session),450),session);
}

function toggleLoop(){
  loopMode=!loopMode;
  const btn=document.getElementById('btnLoop');
  btn.classList.toggle('mode-active',loopMode);
  btn.textContent=loopMode?'🔁 循环中':'🔁 循环';
  showToast(loopMode?'循环播放已开启':'循环播放已关闭',1500);
}

function toggleLoopSection(si){
  const btn=document.getElementById(`btnLoop-${si}`);
  const isOn=btn.classList.contains('mode-active');
  document.querySelectorAll('[id^="btnLoop-"]').forEach(el=>{
    el.classList.remove('mode-active');el.textContent='🔁 循环';
  });
  if(isOn){
    loopMode=false; sectionLoopSi=-1;
    document.getElementById('btnLoop').classList.remove('mode-active');
    document.getElementById('btnLoop').textContent='🔁 循环';
    stopSpeech();
  } else {
    loopMode=true; sectionLoopSi=si;
    btn.classList.add('mode-active'); btn.textContent='🔁 循环中';
    document.getElementById('btnLoop').classList.add('mode-active');
    const synth=window.speechSynthesis;
    if(!synth.speaking&&!synth.paused){
      shouldStop=false; speakSession++;
      const session=speakSession;
      const items=getSpeakItems(si);
      if(!items.length){showToast('没有未学的句子了 🎉',2000);return;}
      speakSectionItems(si,items,0,session);
    } else {
      showToast('🔁 循环已开启，播完后自动重复',2000);
    }
  }
}

function pauseOrResume(){
  const synth=window.speechSynthesis;
  const btn=document.getElementById('btnPause');
  if(synth.speaking&&!synth.paused){
    synth.pause();btn.textContent='▶';btn.classList.add('toggled');
  } else if(synth.paused){
    synth.resume();btn.textContent='⏸';btn.classList.remove('toggled');
  }
}

function stopSpeech(){
  shouldStop=true; speakSession++;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
  document.getElementById('btnPause').textContent='⏸';
  document.getElementById('btnPause').classList.remove('toggled');
  if(loopMode){
    loopMode=false;
    document.getElementById('btnLoop').classList.remove('mode-active');
    document.getElementById('btnLoop').textContent='🔁 循环';
    document.querySelectorAll('[id^="btnLoop-"]').forEach(el=>{
      el.classList.remove('mode-active');el.textContent='🔁 循环';
    });
  }
  // 停止视觉反馈
  document.querySelectorAll('.btn.danger').forEach(el=>{
    el.classList.add('stopped');
    setTimeout(()=>el.classList.remove('stopped'),1500);
  });
}

// ── TOAST ──
let toastTimer=null;
function showToast(msg,ms=1800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}

// ── SCROLL ──
window.addEventListener('scroll',()=>{
  document.getElementById('backTop').classList.toggle('visible',window.scrollY>300);
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)window.speechSynthesis.pause();
});

// ── UTILS ──
function esc(s){
  return String(s).replace(/[&<>"']/g,c=>
    ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}

// ── INIT ──
loadData();
</script>
