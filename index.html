<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Living Japanese｜在日华人日语急救包</title>

  <!-- Google Analytics -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-N484C7TXZ0"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());
    gtag('config', 'G-N484C7TXZ0');
  </script>

  <style>
    :root {
      --bg:        #F5F2ED;
      --surface:   #FFFFFF;
      --text:      #1C1C2E;
      --muted:     #8B7D6B;
      --line:      #E8E2D9;
      --accent:    #C23B35;
      --accent-bg: #FBF0EF;
      --indigo:    #2D3561;
      --indigo-lt: #EEF0F8;
      --green:     #10B981;
      --green-bg:  #F0FDF4;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; }
    html { scroll-behavior: smooth; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Hiragino Sans", "Yu Gothic UI", "Noto Sans JP", sans-serif;
      background: var(--bg);
      color: var(--text);
      line-height: 1.65;
      -webkit-text-size-adjust: 100%;
      overflow-x: hidden;
    }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: rgba(245,242,237,0.96);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border-bottom: 1px solid var(--line);
    }
    .header-inner { max-width: 780px; margin: 0 auto; padding: 10px 14px; }
    .header-top {
      display: flex; align-items: center;
      justify-content: space-between; margin-bottom: 8px;
    }
    .site-title { font-size: 17px; font-weight: 800; letter-spacing: .03em; }
    .header-right { display: flex; gap: 6px; align-items: center; }
    .header-right .btn { font-size: 15px; padding: 7px 13px; }
    .site-subtitle { font-size: 11px; color: var(--muted); }

    .search-wrap { position: relative; margin-bottom: 8px; }
    .search-wrap svg { position: absolute; left: 11px; top: 50%; transform: translateY(-50%); color: var(--muted); pointer-events: none; }
    #searchInput {
      width: 100%; padding: 8px 32px 8px 34px;
      border: 1.5px solid var(--line); border-radius: 10px;
      font-size: 15px; background: var(--surface); color: var(--text); outline: none;
      transition: border-color .15s;
    }
    #searchInput:focus { border-color: var(--accent); }
    #searchClear {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--muted);
      font-size: 17px; display: none; padding: 2px 4px; line-height: 1;
    }

    /* controls */
    .controls { display: flex; gap: 5px; flex-wrap: wrap; align-items: center; }
    .btn {
      display: inline-flex; align-items: center; justify-content: center; gap: 4px;
      font-size: 13px; font-weight: 600; border-radius: 8px;
      border: 1.5px solid var(--line); padding: 6px 10px;
      background: var(--surface); color: var(--text);
      cursor: pointer; white-space: nowrap; min-height: 34px;
      transition: background .12s, border-color .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .btn:active { opacity: .75; }
    .btn:hover { background: var(--indigo-lt); border-color: var(--indigo); }
    .btn.primary { background: var(--indigo); color: #fff; border-color: var(--indigo); }
    .btn.primary:hover { background: #222854; }
    .btn.danger { color: var(--accent); border-color: #F5C5C3; }
    .btn.danger:hover { background: var(--accent-bg); }
    .btn.danger.stopped { background: var(--accent); color: #fff; border-color: var(--accent); }
    .btn.toggled { background: var(--accent-bg); color: var(--accent); border-color: var(--accent); }
    .btn.mode-active { background: var(--indigo); color: #fff; border-color: var(--indigo); }

    /* 朗读模式三按钮 */
    .mode-group { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
    .mode-group .btn {
      border: none; border-radius: 0; border-right: 1px solid var(--line);
      padding: 6px 8px; font-size: 12px; min-height: 34px;
    }
    .mode-group .btn:last-child { border-right: none; }
    .mode-group .btn.mode-active { background: var(--indigo); color: #fff; }

    /* 速度三按钮 */
    .rate-group { display: flex; border: 1.5px solid var(--line); border-radius: 8px; overflow: hidden; }
    .rate-group .btn {
      border: none; border-radius: 0; border-right: 1px solid var(--line);
      padding: 6px 10px; font-size: 12px; min-height: 34px;
    }
    .rate-group .btn:last-child { border-right: none; }
    .rate-group .btn.mode-active { background: var(--indigo); color: #fff; }

    /* ── HERO ── */
    .hero { max-width: 780px; margin: 0 auto; padding: 16px 14px 0; }
    .hero-inner {
      background: var(--indigo); border-radius: 16px;
      padding: 18px 18px 14px; margin-bottom: 16px;
    }
    .hero-sub {
      font-size: 14px; font-weight: 400; color: rgba(255,255,255,.65);
      margin-bottom: 2px;
    }
    .hero-title {
      font-size: 22px; font-weight: 400; color: #FCD34D;
      letter-spacing: .01em; margin-bottom: 12px; line-height: 1.4;
    }
    .hero-lines { display: flex; flex-direction: column; gap: 5px; margin-bottom: 0; }
    .hero-line {
      font-size: 13px; color: rgba(255,255,255,.85);
      display: flex; align-items: center; gap: 8px;
    }
    .hero-line::before {
      content: ''; width: 4px; height: 4px;
      border-radius: 50%; background: #FCD34D; flex-shrink: 0;
    }

    /* ── 今天去哪里（常驻主区域）── */
    .scene-picker { max-width: 780px; margin: 0 auto; padding: 0 14px 4px; }
    .scene-picker-header {
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 10px; margin-top: 14px;
    }
    .scene-picker-title {
      font-size: 17px; font-weight: 800; color: var(--text);
    }
    .scene-picker-sub { font-size: 12px; color: var(--muted); }
    .scene-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
      margin-bottom: 4px;
    }
    @media(min-width:480px){ .scene-grid { grid-template-columns: repeat(4, 1fr); } }
    @media(min-width:640px){ .scene-grid { grid-template-columns: repeat(5, 1fr); } }

    .scene-card {
      background: var(--surface);
      border: 1.5px solid var(--line);
      border-radius: 12px;
      padding: 10px 6px 8px;
      text-align: center;
      cursor: pointer;
      transition: background .12s, border-color .12s, transform .1s;
      -webkit-tap-highlight-color: transparent;
      position: relative;
    }
    .scene-card:hover { background: var(--indigo-lt); border-color: var(--indigo); }
    .scene-card:active { transform: scale(.96); }
    .scene-card.active-scene { border-color: var(--accent); background: var(--accent-bg); }
    .scene-icon { font-size: 22px; margin-bottom: 4px; line-height: 1; }
    .scene-name-ja { font-size: 10px; color: var(--muted); margin-bottom: 1px; line-height: 1.3; }
    .scene-name-zh { font-size: 12px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .scene-prog-dot {
      position: absolute; top: 6px; right: 6px;
      width: 6px; height: 6px; border-radius: 50%;
      background: var(--green); display: none;
    }
    .scene-prog-dot.show { display: block; }

    /* ── 目录 DRAWER ── */
    .drawer-overlay {
      position: fixed; inset: 0; background: rgba(0,0,0,.45);
      z-index: 200; opacity: 0; pointer-events: none;
      transition: opacity .25s;
    }
    .drawer-overlay.open { opacity: 1; pointer-events: all; }
    .drawer {
      position: fixed; bottom: 0; left: 0; right: 0;
      background: var(--surface);
      border-radius: 20px 20px 0 0;
      z-index: 201;
      max-height: 80vh;
      overflow-y: auto;
      -webkit-overflow-scrolling: touch;
      transform: translateY(100%);
      transition: transform .3s cubic-bezier(.32,.72,0,1);
      padding: 0 14px 40px;
    }
    .drawer.open { transform: translateY(0); }
    .drawer-handle {
      width: 36px; height: 4px; background: var(--line);
      border-radius: 2px; margin: 12px auto 14px;
    }
    .drawer-title {
      font-size: 16px; font-weight: 800;
      margin-bottom: 12px; color: var(--text);
    }
    .drawer-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
    .drawer-item {
      display: flex; align-items: center; gap: 8px;
      padding: 10px 10px; border-radius: 10px;
      border: 1px solid var(--line); background: var(--bg);
      cursor: pointer;
      -webkit-tap-highlight-color: transparent;
      transition: background .12s, border-color .12s;
    }
    .drawer-item:active { opacity: .75; }
    .drawer-item:hover { background: var(--indigo-lt); border-color: var(--indigo); }
    .drawer-item.active-scene { background: var(--accent-bg); border-color: var(--accent); }
    .drawer-item-icon { font-size: 18px; flex-shrink: 0; }
    .drawer-item-text { flex: 1; min-width: 0; }
    .drawer-item-ja { font-size: 10px; color: var(--muted); line-height: 1.3; }
    .drawer-item-zh { font-size: 13px; font-weight: 700; color: var(--text); line-height: 1.3; }
    .drawer-item-count { font-size: 11px; color: var(--muted); flex-shrink: 0; }
    .drawer-item-prog { font-size: 11px; color: var(--green); font-weight: 700; flex-shrink: 0; }

    /* ── MAIN ── */
    main { max-width: 780px; margin: 0 auto; padding: 14px 14px 100px; }

    /* SECTION */
    .section-block { margin-bottom: 32px; scroll-margin-top: 20px; }
    .section-head { display: flex; align-items: flex-start; gap: 12px; margin-bottom: 8px; }
    .section-accent-bar { width: 3px; min-height: 48px; background: var(--accent); border-radius: 2px; flex-shrink: 0; margin-top: 3px; }
    .section-meta { flex: 1; }
    .section-cat { font-size: 10px; font-weight: 700; letter-spacing: .1em; color: var(--accent); text-transform: uppercase; margin-bottom: 1px; }
    .section-title-ja { font-size: 18px; font-weight: 800; letter-spacing: .01em; line-height: 1.3; }
    .section-title-zh { font-size: 13px; color: var(--muted); font-weight: 400; margin-bottom: 2px; }
    .section-desc { font-size: 12px; color: var(--muted); margin-bottom: 4px; font-style: italic; }
    .section-progress-wrap { display: flex; align-items: center; gap: 8px; margin-top: 4px; }
    .section-progress-text { font-size: 12px; color: var(--muted); }
    .progress-bar-wrap { flex: 1; max-width: 120px; height: 4px; background: var(--line); border-radius: 2px; overflow: hidden; }
    .progress-bar-fill { height: 100%; background: var(--accent); border-radius: 2px; transition: width .3s; }

    .section-btns { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: 10px; padding-left: 15px; }

    /* 只看未学 toggle */
    .filter-toggle {
      display: flex; align-items: center; gap: 6px;
      font-size: 12px; color: var(--muted); cursor: pointer;
      padding: 4px 10px; border-radius: 20px;
      border: 1.5px solid var(--line); background: var(--surface);
      -webkit-tap-highlight-color: transparent;
      transition: background .12s, border-color .12s, color .12s;
    }
    .filter-toggle.on { background: var(--indigo-lt); border-color: var(--indigo); color: var(--indigo); font-weight: 700; }
    .toggle-dot {
      width: 14px; height: 14px; border-radius: 50%;
      border: 1.5px solid var(--line); background: var(--surface);
      display: flex; align-items: center; justify-content: center;
      font-size: 9px; transition: background .12s, border-color .12s;
    }
    .filter-toggle.on .toggle-dot { background: var(--indigo); border-color: var(--indigo); color: #fff; }

    /* 完成提示 */
    .complete-banner {
      background: var(--green-bg); border: 1.5px solid var(--green);
      border-radius: 14px; padding: 16px;
      text-align: center; margin-bottom: 8px;
    }
    .complete-banner-emoji { font-size: 28px; margin-bottom: 6px; }
    .complete-banner-text { font-size: 14px; font-weight: 700; color: var(--green); margin-bottom: 10px; }
    .complete-banner-next { display: inline-flex; align-items: center; gap: 4px; }

    /* CARD */
    .card {
      background: var(--surface); border: 1px solid var(--line);
      border-radius: 14px; padding: 14px 14px 11px;
      margin-bottom: 8px; border-left: 3px solid transparent;
      transition: border-left-color .15s, box-shadow .15s;
      position: relative;
    }
    .card:hover { box-shadow: 0 3px 14px rgba(28,28,46,.07); }
    .card.speaking { border-left-color: var(--accent); background: var(--accent-bg); }
    .card.checked { border-left-color: var(--green); background: var(--green-bg); opacity: .75; }
    .card-num { font-size: 11px; color: var(--muted); font-weight: 600; letter-spacing: .06em; margin-bottom: 4px; }

    .jp-text { font-size: 21px; font-weight: 700; letter-spacing: .02em; line-height: 2; margin-bottom: 3px; }
    .jp-text ruby { ruby-align: center; }
    .jp-text rt { font-size: 10px; font-weight: 400; color: var(--muted); }
    body.hide-ruby rt { visibility: hidden; }

    .zh-text { font-size: 15px; color: var(--muted); margin-bottom: 6px; }
    .card-note { font-size: 11px; color: var(--muted); font-style: italic; margin-bottom: 8px; padding: 4px 8px; background: var(--bg); border-radius: 6px; }
    .card-actions { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
    .card-actions .btn { font-size: 12px; padding: 4px 10px; min-height: 30px; }

    /* 学会了按钮 */
    .learned-btn {
      margin-left: auto; flex-shrink: 0;
      display: inline-flex; align-items: center; gap: 4px;
      font-size: 12px; font-weight: 600;
      padding: 4px 10px; min-height: 30px;
      border-radius: 20px;
      border: 1.5px solid var(--line);
      background: var(--surface); color: var(--muted);
      cursor: pointer;
      transition: background .12s, border-color .12s, color .12s;
      -webkit-tap-highlight-color: transparent;
    }
    .learned-btn:hover { border-color: var(--green); color: var(--green); }
    .learned-btn.learned { background: var(--green); border-color: var(--green); color: #fff; }

    .freq { position: absolute; top: 12px; right: 12px; display: flex; gap: 2px; }
    .freq-dot { width: 5px; height: 5px; border-radius: 50%; background: var(--line); }
    .freq-dot.on { background: var(--accent); }

    /* SEARCH */
    .search-header { font-size: 13px; color: var(--muted); margin-bottom: 14px; padding-bottom: 8px; border-bottom: 1px solid var(--line); }
    .search-section-label { font-size: 11px; font-weight: 700; color: var(--accent); letter-spacing: .08em; text-transform: uppercase; margin: 16px 0 6px; }
    mark { background: #FFF0B0; color: var(--text); border-radius: 2px; padding: 0 1px; }

    /* 分享按钮浮动 */
    #fabShare {
      position: fixed; bottom: 80px; right: 18px;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--surface); color: var(--indigo);
      border: 1.5px solid var(--line);
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 2px 10px rgba(0,0,0,.1);
      z-index: 89;
      -webkit-tap-highlight-color: transparent;
    }

    /* BACK TO TOP */
    #backTop {
      position: fixed; bottom: 24px; right: 18px;
      width: 42px; height: 42px; border-radius: 50%;
      background: var(--indigo); color: #fff; border: none;
      cursor: pointer; display: flex; align-items: center; justify-content: center;
      box-shadow: 0 4px 14px rgba(45,53,97,.3);
      opacity: 0; transform: translateY(8px);
      transition: opacity .2s, transform .2s; z-index: 90;
    }
    #backTop.visible { opacity: 1; transform: translateY(0); }

    /* TOAST */
    #toast {
      position: fixed; bottom: 76px; left: 50%;
      transform: translateX(-50%) translateY(6px);
      background: var(--text); color: #fff;
      font-size: 13px; font-weight: 600;
      padding: 8px 18px; border-radius: 20px;
      opacity: 0; transition: opacity .2s, transform .2s;
      pointer-events: none; z-index: 300; white-space: nowrap;
    }
    #toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    #loading { text-align: center; padding: 60px 20px; color: var(--muted); font-size: 15px; }
    footer { text-align: center; font-size: 12px; color: var(--muted); padding: 20px 14px 40px; line-height: 1.8; }
  </style>
</head>
<body>

<header id="top">
  <div class="header-inner">
    <div class="header-top">
      <span class="site-title">Living Japanese</span>
      <div class="header-right">
        <span class="site-subtitle" id="subtitle">日本生活会話</span>
        <button class="btn" onclick="openDrawer()">📋 目录</button>
        <button class="btn" onclick="showAll()">全部</button>
      </div>
    </div>
    <div class="search-wrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.35-4.35"/></svg>
      <input id="searchInput" type="search" placeholder="搜索日文或中文…" autocomplete="off">
      <button id="searchClear" onclick="clearSearch()">×</button>
    </div>
    <div class="controls">
      <button class="btn primary" onclick="speakAll()">▶ 朗读</button>
      <button class="btn" id="btnPause" onclick="pauseOrResume()">⏸</button>
      <button class="btn danger" onclick="stopSpeech()">■ 停止</button>
      <button class="btn" id="btnLoop" onclick="toggleLoop()">🔁 循环</button>
      <button class="btn" id="btnRuby" onclick="toggleRuby()">振假名</button>
      <div class="mode-group">
        <button class="btn mode-active" id="mode-jp" onclick="setMode('jp')">仅日语</button>
        <button class="btn" id="mode-jp_zh" onclick="setMode('jp_zh')">日→中</button>
        <button class="btn" id="mode-repeat" onclick="setMode('repeat')">日→中→日</button>
      </div>
      <div class="rate-group">
        <button class="btn" id="rate-0.9" onclick="setRate('0.9')">普通</button>
        <button class="btn mode-active" id="rate-0.75" onclick="setRate('0.75')">慢</button>
        <button class="btn" id="rate-0.6" onclick="setRate('0.6')">更慢</button>
      </div>
    </div>
  </div>
</header>

<!-- HERO -->
<div class="hero">
  <div class="hero-inner">
    <div class="hero-sub">在日本生活，</div>
    <div class="hero-title">语言是第一道墙。</div>
    <div class="hero-lines">
      <div class="hero-line">这里有你每天会用到的日语。</div>
      <div class="hero-line">不用背，用的时候来查就好。</div>
      <div class="hero-line">出门前选好场景，跟着朗读练一遍。</div>
    </div>
  </div>
</div>

<!-- 今天去哪里 场景选择器 -->
<div class="scene-picker">
  <div class="scene-picker-header">
    <span class="scene-picker-title">今天去哪里？</span>
    <span class="scene-picker-sub" id="totalCount"></span>
  </div>
  <div class="scene-grid" id="sceneGrid"></div>
</div>

<!-- 目录 DRAWER -->
<div class="drawer-overlay" id="drawerOverlay" onclick="closeDrawer()"></div>
<div class="drawer" id="drawer">
  <div class="drawer-handle"></div>
  <div class="drawer-title">📋 全部场景</div>
  <div class="drawer-grid" id="drawerGrid"></div>
</div>

<main>
  <div id="loading">加载中…</div>
  <div id="content"></div>
</main>

<footer>
  Living Japanese｜在日华人日语急救包<br>
  由在日生活20年以上的华人制作，专为在日华人设计<br>
  <a href="https://livingjapanese.app" style="color:var(--muted)">livingjapanese.app</a>
</footer>

<button id="fabShare" onclick="shareApp()" title="分享">
  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><line x1="8.59" y1="13.51" x2="15.42" y2="17.49"/><line x1="15.41" y1="6.51" x2="8.59" y2="10.49"/></svg>
</button>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M18 15l-6-6-6 6"/></svg>
</button>
<div id="toast"></div>

<script>
const DATA_FILES = ['data/sentences_core.json'];

const SCENE_ICONS = {
  '家庭・毎日の言葉':'🏠','子供への声掛け':'👶','幼稚園・保育園':'🎒',
  'スーパー・買い物':'🛒','電車・バス':'🚃','病院':'🏥',
  '薬局・ドラッグストア':'💊','銀行・郵便局':'🏦','役所・手続き':'📋',
  '困ったとき・言葉の壁':'🆘','近所・挨拶':'👋','飲食店':'🍽️',
  'コンビニ':'🏪','スーパー':'🛍️','アルバイト共通':'💼',
};

let allSections = [];
let flat = [];
let shouldStop = false;
let rubyVisible = true;
let currentSection = -1;
let previousSection = -1;
let checkedItems = {};
let filterUnlearned = {};
let currentMode = 'jp';
let currentRate = '0.75';
let jaVoice = null;
let zhVoice = null;

// ── VOICE INIT ──
function initVoices() {
  const voices = window.speechSynthesis.getVoices();
  if (!voices.length) return;
  const jaPrefs = ['Kyoko','Otoya','O-ren','Hattori'];
  for (const n of jaPrefs) { jaVoice = voices.find(v => v.name.includes(n) && v.lang.startsWith('ja')); if (jaVoice) break; }
  if (!jaVoice) jaVoice = voices.find(v => v.lang === 'ja-JP' || v.lang === 'ja');
  const zhPrefs = ['Ting-Ting','Sin-ji','Mei-Jia','Tian-Tian'];
  for (const n of zhPrefs) { zhVoice = voices.find(v => v.name.includes(n)); if (zhVoice) break; }
  if (!zhVoice) zhVoice = voices.find(v => v.lang.startsWith('zh') && !v.lang.startsWith('ja'));
}
window.speechSynthesis.onvoiceschanged = initVoices;
initVoices();

// ── MODE & RATE ──
function setMode(m) {
  currentMode = m;
  ['jp','jp_zh','repeat'].forEach(k => {
    document.getElementById(`mode-${k}`).classList.toggle('mode-active', k === m);
  });
}
function setRate(r) {
  currentRate = r;
  ['0.9','0.75','0.6'].forEach(k => {
    document.getElementById(`rate-${k}`).classList.toggle('mode-active', k === r);
  });
}

// ── KANJI ──
function isKanji(ch) {
  const c = ch.codePointAt(0);
  return (c>=0x4E00&&c<=0x9FFF)||(c>=0x3400&&c<=0x4DBF)||(c>=0xF900&&c<=0xFAFF);
}
function buildRubyHtml(jp, furigana) {
  if (!furigana || furigana === jp) return esc(jp);
  const segs = [];
  let i = 0;
  while (i < jp.length) {
    if (isKanji(jp[i])) {
      let k=i; while(k<jp.length&&isKanji(jp[k]))k++;
      segs.push({text:jp.slice(i,k),kanji:true}); i=k;
    } else {
      let k=i; while(k<jp.length&&!isKanji(jp[k]))k++;
      segs.push({text:jp.slice(i,k),kanji:false}); i=k;
    }
  }
  let fPos=0, html='';
  for (let s=0;s<segs.length;s++) {
    const seg=segs[s];
    if (!seg.kanji) {
      const idx=furigana.indexOf(seg.text,fPos);
      if(idx!==-1)fPos=idx+seg.text.length;
      html+=esc(seg.text);
    } else {
      let fEnd=furigana.length;
      if(s+1<segs.length){const idx=furigana.indexOf(segs[s+1].text,fPos);if(idx!==-1)fEnd=idx;}
      const reading=furigana.slice(fPos,fEnd);
      fPos=fEnd;
      html+=reading?`<ruby>${esc(seg.text)}<rt>${esc(reading)}</rt></ruby>`:esc(seg.text);
    }
  }
  return html;
}

// ── STORAGE ──
function loadStorage() {
  try { checkedItems = JSON.parse(localStorage.getItem('lj_checked')||'{}'); } catch(e){checkedItems={};}
  try { const s = localStorage.getItem('lj_last_section'); if(s!==null) currentSection=parseInt(s); } catch(e){}
}
function saveChecked() {
  try { localStorage.setItem('lj_checked', JSON.stringify(checkedItems)); } catch(e){}
}
function saveLastSection(si) {
  try { localStorage.setItem('lj_last_section', String(si)); } catch(e){}
}

// ── LOAD ──
async function loadData() {
  loadStorage();
  try {
    const results = await Promise.all(DATA_FILES.map(f=>fetch(f).then(r=>r.json())));
    results.forEach(d=>{ allSections=allSections.concat(d.sections); });
    buildFlat();
    renderSceneGrid();
    renderDrawer();
    // 恢复上次场景
    if (currentSection >= 0 && currentSection < allSections.length) {
      renderContent(currentSection);
    } else {
      renderContent(-1);
    }
    document.getElementById('loading').style.display='none';
    document.getElementById('subtitle').textContent=`${flat.length}句`;
    document.getElementById('totalCount').textContent=`共${allSections.length}个场景`;
  } catch(e) {
    document.getElementById('loading').textContent='加载失败，请确认 data/sentences_core.json 存在。';
  }
}

function buildFlat() {
  flat=[];
  allSections.forEach((sec,si)=>{
    sec.items.forEach((item,ii)=>flat.push({si,ii,item}));
  });
}

// ── SCENE GRID ──
function renderSceneGrid() {
  const grid = document.getElementById('sceneGrid');
  grid.innerHTML = allSections.map((sec,si)=>{
    const icon = SCENE_ICONS[sec.title]||'📖';
    const {done,total} = getSectionProgress(si);
    const hasProgress = done > 0;
    return `
      <div class="scene-card${currentSection===si?' active-scene':''}" onclick="showSection(${si})" id="sc-${si}">
        <div class="scene-prog-dot${hasProgress?' show':''}" id="sc-dot-${si}"></div>
        <div class="scene-icon">${icon}</div>
        <div class="scene-name-ja">${esc(sec.title)}</div>
        <div class="scene-name-zh">${esc(sec.title_zh||'')}</div>
      </div>`;
  }).join('');
}

function updateSceneCard(si) {
  const card = document.getElementById(`sc-${si}`);
  if (!card) return;
  card.classList.toggle('active-scene', currentSection===si);
  const dot = document.getElementById(`sc-dot-${si}`);
  const {done} = getSectionProgress(si);
  if (dot) dot.classList.toggle('show', done>0);
}

// ── DRAWER ──
function renderDrawer() {
  const grid = document.getElementById('drawerGrid');
  grid.innerHTML = allSections.map((sec,si)=>{
    const icon = SCENE_ICONS[sec.title]||'📖';
    const {done,total} = getSectionProgress(si);
    return `
      <div class="drawer-item${currentSection===si?' active-scene':''}" onclick="showSection(${si});closeDrawer();" id="di-${si}">
        <div class="drawer-item-icon">${icon}</div>
        <div class="drawer-item-text">
          <div class="drawer-item-ja">${esc(sec.title)}</div>
          <div class="drawer-item-zh">${esc(sec.title_zh||'')}</div>
        </div>

function openDrawer() {
  document.getElementById('drawer').classList.add('open');
  document.getElementById('drawerOverlay').classList.add('open');
  document.body.style.overflow='hidden';
}
function closeDrawer() {
  document.getElementById('drawer').classList.remove('open');
  document.getElementById('drawerOverlay').classList.remove('open');

// ── PROGRESS ──
function getSectionProgress(si) {
  const sec=allSections[si];
  const total=sec.items.length;
  const done=sec.items.filter((_,ii)=>checkedItems[`${si}-${ii}`]).length;
  return {done,total};
}

// ── CONTENT ──
function renderContent(filterSi) {
  currentSection=filterSi;
  saveLastSection(filterSi);
  const content=document.getElementById('content');
  let globalNum=1;
  const nums=[];
  allSections.forEach((sec,si)=>{
    sec.items.forEach((item,ii)=>{nums.push({si,ii,n:globalNum++});});
  });

  const sectionsToShow = filterSi===-1
    ? allSections.map((s,i)=>({sec:s,si:i}))
    : [{sec:allSections[filterSi],si:filterSi}];

  content.innerHTML = sectionsToShow.map(({sec,si})=>{
    const {done,total}=getSectionProgress(si);
    const pct=total?Math.round(done/total*100):0;
    const isFiltered=!!filterUnlearned[si];
    const itemsToShow=sec.items.filter((_,ii)=>!isFiltered||!checkedItems[`${si}-${ii}`]);
    const allDone = done===total && total>0;

    const cards=itemsToShow.map((item,_)=>{
      const ii=sec.items.indexOf(item);
      const entry=nums.find(x=>x.si===si&&x.ii===ii);
      const n=entry?entry.n:'';
      const isChecked=!!checkedItems[`${si}-${ii}`];
      const freqDots=[1,2,3,4,5].map(d=>`<span class="freq-dot${d<=(item.frequency||5)?' on':''}"></span>`).join('');
      const noteHtml=item.notes?`<div class="card-note">💡 ${esc(item.notes)}</div>`:'';
      return `
        <div class="card${isChecked?' checked':''}${isChecked?' speaking-off':''}" id="card-${si}-${ii}">
          <div class="card-num">${n}</div>
          <div class="freq">${freqDots}</div>
          <div class="jp-text">${buildRubyHtml(item.jp,item.furigana)}</div>
          <div class="zh-text">${esc(item.zh)}</div>
          ${noteHtml}
          <div class="card-actions">
            <button class="btn" onclick="speakItem(${si},${ii})">▶ 朗读</button>
            <button class="btn" onclick="speakJpOnly(${si},${ii})">▶ 仅日语</button>
            <button class="learned-btn${isChecked?' learned':''}" onclick="toggleCheck(${si},${ii})" id="chk-${si}-${ii}">
              ${isChecked?'✓ 学会了':'学会了'}
            </button>
          </div>
        </div>`;
    }).join('');

    // 完成提示
    const nextSi = si+1 < allSections.length ? si+1 : -1;
    const completeBanner = allDone && !isFiltered ? `
      <div class="complete-banner">
        <div class="complete-banner-emoji">🎉</div>
        <div class="complete-banner-text">本章全部学完了！</div>
        ${nextSi>=0?`<button class="btn primary complete-banner-next" onclick="showSection(${nextSi})">下一章：${esc(allSections[nextSi].title_zh||allSections[nextSi].title)} →</button>`:''}
      </div>` : '';

    return `
      <div class="section-block" id="section-${si}">
        <div class="section-head">
          <div class="section-accent-bar"></div>
          <div class="section-meta">
            <div class="section-cat">${esc(sec.category)}</div>
            <div class="section-title-ja">${esc(sec.title)}</div>
            <div class="section-title-zh">${esc(sec.title_zh||'')}</div>
            ${sec.description?`<div class="section-desc">${esc(sec.description)}</div>`:''}
            <div class="section-progress-wrap">
              <span class="section-progress-text">${done} / ${total} 句</span>
              <div class="progress-bar-wrap"><div class="progress-bar-fill" id="pb-${si}" style="width:${pct}%"></div></div>
            </div>
          </div>
        </div>
        <div class="section-btns">
          <button class="btn primary" onclick="speakSection(${si})" id="spk-${si}">▶ 朗读本章</button>
          <button class="btn" id="btnLoop-${si}" onclick="toggleLoopSection(${si})">🔁 循环</button>
          <button class="btn danger" onclick="stopSpeech()" id="stop-${si}">■ 停止</button>
          <button class="filter-toggle${isFiltered?' on':''}" onclick="toggleFilter(${si})" id="ft-${si}" title="${isFiltered?'点击显示全部':'勾选「学会了」的句子将被隐藏'}">
            <span class="toggle-dot">${isFiltered?'✓':''}</span>
            <span>${isFiltered?'只看未学（点击显示全部）':'只看未学'}</span>
          </button>
        </div>
        ${completeBanner}
        ${cards||'<p style="color:var(--muted);padding:12px 0;font-size:14px">🎉 全部已学完！</p>'}
      </div>`;
  }).join('');

  // 更新场景卡片状态
  allSections.forEach((_,si)=>updateSceneCard(si));
}

// ── FILTER ──
function toggleFilter(si) {
  filterUnlearned[si]=!filterUnlearned[si];
  renderContent(currentSection);
  setTimeout(()=>{
    const el=document.getElementById(`section-${si}`);
    if(el){
      const h=document.querySelector('header').offsetHeight;
      window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-h-10,behavior:'smooth'});
    }
  },60);
}

// ── CHECK ──
function toggleCheck(si,ii) {
  const key=`${si}-${ii}`;
  checkedItems[key]=!checkedItems[key];
  if(!checkedItems[key])delete checkedItems[key];
  saveChecked();

  const isChecked=!!checkedItems[key];
  const isFiltered=!!filterUnlearned[si];

  // 如果「只看未学」已开启，勾选后直接隐藏该卡片，取消勾选则重新渲染
  if(isFiltered){
    if(isChecked){
      // 直接隐藏卡片，无需重渲染
      const card=document.getElementById(`card-${si}-${ii}`);
      if(card){
        card.style.transition='opacity .3s, transform .3s';
        card.style.opacity='0';
        card.style.transform='translateX(20px)';
        setTimeout(()=>{
          if(card.parentNode) card.parentNode.removeChild(card);
          updateSectionProgress(si);
          updateSceneCard(si);
          updateDrawerItem(si);
          // 检查是否全部完成
          const {done,total}=getSectionProgress(si);
          if(done===total&&total>0) setTimeout(()=>renderContent(currentSection),300);
        },300);
      }
    } else {
      // 取消勾选时重新渲染以显示该句
      renderContent(currentSection);
    }
    return;
  }

  // 未开启筛选时：正常更新卡片状态
  const card=document.getElementById(`card-${si}-${ii}`);
  const btn=document.getElementById(`chk-${si}-${ii}`);
  if(card) card.classList.toggle('checked', isChecked);
  if(btn){ btn.classList.toggle('learned', isChecked); btn.textContent=isChecked?'✓ 学会了':'学会了'; }

  updateSectionProgress(si);
  updateSceneCard(si);
  updateDrawerItem(si);

  // 检查是否全部完成
  const {done,total}=getSectionProgress(si);
  if(done===total&&total>0){
    setTimeout(()=>renderContent(currentSection),300);
  }
}

function updateSectionProgress(si) {
  const {done,total}=getSectionProgress(si);
  const pct=total?Math.round(done/total*100):0;
  const text=document.querySelector(`#section-${si} .section-progress-text`);
  const fill=document.getElementById(`pb-${si}`);
  if(text)text.textContent=`${done} / ${total} 句`;
  if(fill)fill.style.width=pct+'%';
}

function updateDrawerItem(si) {
  const el=document.getElementById(`di-${si}`);
  if(!el)return;
  const {done,total}=getSectionProgress(si);
  const progEl=el.querySelector('.drawer-item-prog,.drawer-item-count');
  if(progEl){
    if(done>0){progEl.className='drawer-item-prog';progEl.textContent=`${done}/${total}`;}
    else{progEl.className='drawer-item-count';progEl.textContent=`${total}句`;}
  }
}

  document.body.classList.toggle('hide-ruby',!rubyVisible);
  const btn=document.getElementById('btnRuby');
  btn.textContent=rubyVisible?'振假名':'振假名 关';

// ── SEARCH ──
document.getElementById('searchInput').addEventListener('input',function(){
  const q=this.value.trim();
  document.getElementById('searchClear').style.display=q?'block':'none';
  if(!q){clearSearch();return;}
  previousSection=currentSection;
  doSearch(q);
});

function doSearch(q) {
  stopSpeech();
  const lower=q.toLowerCase();
  let total=0,html='';
  allSections.forEach((sec,si)=>{
    const hits=sec.items.filter(item=>
      item.jp.includes(q)||item.zh.includes(q)||
      (item.furigana&&item.furigana.includes(q))||
      item.zh.toLowerCase().includes(lower)
    );
    if(!hits.length)return;
    total+=hits.length;
    html+=`<div class="search-section-label">${esc(sec.title_zh||sec.title)}</div>`;
    hits.forEach(item=>{
      const ii=sec.items.indexOf(item);
      html+=`
        <div class="card">
          <div class="jp-text">${hlText(item.jp,q)}</div>
          <div class="zh-text">${hlText(item.zh,q)}</div>
          <div class="card-actions">
            <button class="btn" onclick="speakItem(${si},${ii})">▶ 朗读</button>
            <button class="btn" onclick="speakJpOnly(${si},${ii})">▶ 仅日语</button>
          </div>
        </div>`;
    });
  });
  document.getElementById('content').innerHTML=`
    <div class="search-header">「${esc(q)}」的搜索结果：${total}句</div>
    ${html||'<p style="color:var(--muted);padding:20px 0">没有找到相关句子。</p>'}`;
}

function hlText(text,q) {
  const e=esc(text);
  const eq=esc(q).replace(/[.*+?^${}()|[\]\\]/g,'\\$&');
  return e.replace(new RegExp(eq,'gi'),m=>`<mark>${m}</mark>`);
}

function clearSearchUI() {
  document.getElementById('searchInput').value='';
  document.getElementById('searchClear').style.display='none';
}

function clearSearch() {
  clearSearchUI();
  renderContent(previousSection);
  if(previousSection!==-1){
    setTimeout(()=>{
      const el=document.getElementById(`section-${previousSection}`);
      if(el){const h=document.querySelector('header').offsetHeight;window.scrollTo({top:el.getBoundingClientRect().top+window.scrollY-h-10,behavior:'smooth'});}
    },60);
  } else {
    window.scrollTo({top:0,behavior:'smooth'});
  }
}

// ── SPEECH ──
let loopMode = false; // 循环播放状态
let speakSession = 0; // 用于防止旧回调干扰新朗读

function getModeTexts(item) {
  if(currentMode==='jp') return [{text:item.jp,lang:'ja-JP',voice:jaVoice}];
  if(currentMode==='jp_zh') return [
    {text:item.jp,lang:'ja-JP',voice:jaVoice},
    {text:item.zh,lang:'zh-CN',voice:zhVoice}
  ];
  return [
    {text:item.jp,lang:'ja-JP',voice:jaVoice},
    {text:item.zh,lang:'zh-CN',voice:zhVoice},
    {text:item.jp,lang:'ja-JP',voice:jaVoice}
  ];
}

// 获取当前场景需要朗读的句子列表（考虑只看未学筛选）
function getSpeakItems(si) {
  const sec = allSections[si];
  const isFiltered = !!filterUnlearned[si];
  return sec.items
    .map((item,ii)=>({item,ii}))
    .filter(({ii})=>!isFiltered||!checkedItems[`${si}-${ii}`]);
}

function speakSegments(segs, onEnd, session) {
  const synth = window.speechSynthesis;
  synth.cancel();
  let i = 0;
  // 短暂延迟再开始，避免cancel和speak冲突导致重复
  setTimeout(()=>{
    function next(){
      if(shouldStop || speakSession !== session) return;
      if(i>=segs.length){ if(onEnd) onEnd(); return; }
      const seg = segs[i++];
      const u = new SpeechSynthesisUtterance(seg.text);
      u.lang = seg.lang;
      u.rate = parseFloat(currentRate);
      u.pitch = 1;
      if(seg.voice) u.voice = seg.voice;
      u.onend = ()=>setTimeout(next, 350);
      u.onerror = ()=>setTimeout(next, 100);
      synth.speak(u);
    }
    next();
  }, 80);
}

function highlightCard(si,ii) {
  document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
  const el = document.getElementById(`card-${si}-${ii}`);
  if(el){ el.classList.add('speaking'); el.scrollIntoView({behavior:'smooth',block:'center'}); }
}

function speakItem(si,ii) {
  shouldStop = false;
  speakSession++;
  const session = speakSession;
  highlightCard(si,ii);
  speakSegments(getModeTexts(allSections[si].items[ii]), null, session);
}

function speakJpOnly(si,ii) {
  shouldStop = false;
  speakSession++;
  const session = speakSession;
  highlightCard(si,ii);
  speakSegments([{text:allSections[si].items[ii].jp,lang:'ja-JP',voice:jaVoice}], null, session);
}

function speakSection(si) {
  shouldStop = false;
  speakSession++;
  const session = speakSession;
  const items = getSpeakItems(si);
  if(!items.length){ showToast('没有未学的句子了 🎉', 2000); return; }
  speakSectionItems(si, items, 0, session);
}

function speakSectionItems(si, items, idx, session) {
  if(shouldStop || speakSession !== session) return;
  if(idx >= items.length){
    document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
    if(loopMode){
      showToast('🔁 循环播放中…', 1500);
      setTimeout(()=>{
        if(!shouldStop && speakSession === session){
          const freshItems = getSpeakItems(si);
          speakSectionItems(si, freshItems, 0, session);
        }
      }, 800);
    } else {
      showToast('✓ 朗读完毕', 2200);
    }
    return;
  }
  const {item, ii} = items[idx];
  highlightCard(si, ii);
  speakSegments(getModeTexts(item), ()=>{
    setTimeout(()=>speakSectionItems(si, items, idx+1, session), 450);
  }, session);
}

function speakAll() {
  shouldStop = false;
  speakSession++;
  const session = speakSession;
  showToast('开始朗读…');
  // 收集需要朗读的句子（考虑筛选状态）
  let speakList = [];
  allSections.forEach((sec,si)=>{
    if(currentSection !== -1 && si !== currentSection) return;
    const items = getSpeakItems(si);
    items.forEach(({item,ii})=>speakList.push({si,ii,item}));
  });
  if(!speakList.length){ showToast('没有未学的句子了 🎉', 2000); return; }
  speakList_(speakList, 0, session);
}

function speakList_(list, index, session) {
  if(shouldStop || speakSession !== session) return;
  if(index >= list.length){
    document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
    showToast('✓ 全部朗读完毕', 2200);
    return;
  }
  const {si,ii,item} = list[index];
  highlightCard(si,ii);
  speakSegments(getModeTexts(item), ()=>{
    setTimeout(()=>speakList_(list, index+1, session), 450);
  }, session);
}

// 循环播放开关
function toggleLoop() {
  loopMode = !loopMode;
  const btn = document.getElementById('btnLoop');
  btn.classList.toggle('mode-active', loopMode);
  btn.textContent = loopMode ? '🔁 循环中' : '🔁 循环';
  if(loopMode) showToast('循环播放已开启', 1500);
  else showToast('循环播放已关闭', 1500);
}

function pauseOrResume() {
  const synth = window.speechSynthesis;
  const btn = document.getElementById('btnPause');
  if(synth.speaking&&!synth.paused){
    synth.pause(); btn.textContent='▶'; btn.classList.add('toggled');
  } else if(synth.paused){
    synth.resume(); btn.textContent='⏸'; btn.classList.remove('toggled');
  }
}

function stopSpeech() {
  shouldStop = true;
  speakSession++;
  window.speechSynthesis.cancel();
  document.querySelectorAll('.card.speaking').forEach(el=>el.classList.remove('speaking'));
  const btn = document.getElementById('btnPause');
  btn.textContent = '⏸'; btn.classList.remove('toggled');
  // 停止时关闭循环
  if(loopMode){
    loopMode=false;
    const lb=document.getElementById('btnLoop');
    if(lb){lb.classList.remove('mode-active');lb.textContent='🔁 循环';}
  }
  // 所有场景循环按钮重置
  document.querySelectorAll('[id^="btnLoop-"]').forEach(el=>{
    el.classList.remove('mode-active');el.textContent='🔁 循环';
  });
  // 停止按钮视觉反馈：变红1.5秒后恢复
  document.querySelectorAll('.btn.danger').forEach(el=>{
    el.classList.add('stopped');
    setTimeout(()=>el.classList.remove('stopped'), 1500);
  });
}

// 场景内循环按钮
let sectionLoopSi = -1; // 记录哪个场景在循环
function toggleLoopSection(si) {
  const btn = document.getElementById(`btnLoop-${si}`);
  const isOn = btn.classList.contains('mode-active');
  // 先重置所有场景循环按钮
  document.querySelectorAll('[id^="btnLoop-"]').forEach(el=>{
    el.classList.remove('mode-active'); el.textContent='🔁 循环';
  });
  if(isOn){
    // 关闭循环
    loopMode=false; sectionLoopSi=-1;
    const lb=document.getElementById('btnLoop');
    if(lb){lb.classList.remove('mode-active');lb.textContent='🔁 循环';}
    stopSpeech();
  } else {
    // 开启该场景循环
    loopMode=true; sectionLoopSi=si;
    btn.classList.add('mode-active'); btn.textContent='🔁 循环中';
    const lb=document.getElementById('btnLoop');
    if(lb){lb.classList.add('mode-active');}
    // 只有当前没有在播放时才开始，否则等播完自动循环
    const synth=window.speechSynthesis;
    if(!synth.speaking && !synth.paused){
      shouldStop=false;
      speakSession++;
      const session=speakSession;
      const items=getSpeakItems(si);
      if(!items.length){showToast('没有未学的句子了 🎉',2000);return;}
      speakSectionItems(si,items,0,session);
    } else {
      showToast('🔁 循环已开启，播完后自动重复',2000);
    }
  }
}

    }).catch(()=>{showToast('请复制：livingjapanese.app',2500);});

}

// ── TOAST ──
let toastTimer=null;
function showToast(msg,ms=1800){
  const t=document.getElementById('toast');
  t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(()=>t.classList.remove('show'),ms);
}

// ── SCROLL ──
window.addEventListener('scroll',()=>{
  document.getElementById('backTop').classList.toggle('visible',window.scrollY>300);
});
document.addEventListener('visibilitychange',()=>{
  if(document.hidden)window.speechSynthesis.pause();
});

function esc(s){
  return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
}
