<!doctype html>

<head>
<meta charset="utf-8">

<meta name="keywords" content="在日华人,日语急救,在日本生活,日语工具,生活日语,在日语言,日本生活,润日,日活">

<meta property="og:title" content="Living Japanese · 日活 | 在日华人日语急救包">

<!-- Google Analytics -->
<script async src="https://www.googletagmanager.com/gtag/js?id=G-N484C7TXZ0"></script>
<script>
  window.dataLayer=window.dataLayer||[];
  function gtag(){dataLayer.push(arguments);}
  gtag('js',new Date()); gtag('config','G-N484C7TXZ0');
</script>

<!-- CSS -->
<link rel="stylesheet" href="css/base.css">
<link rel="stylesheet" href="css/sos.css">
</head>
<body>

<!-- ══ HEADER ══ -->
<div id="header">
  <div class="header-bar">
    <div class="wordmark">
      <span>Living Japanese</span>
      <div class="wordmark-dot"></div>
    </div>
    <div class="search-wrap" id="searchWrap">
      <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
           stroke="currentColor" stroke-width="2">
        <circle cx="11" cy="11" r="8"/>
        <path d="m21 21-4.35-4.35"/>
      </svg>
      <input id="searchInput" type="search" autocomplete="off">
    </div>
  </div>
  <div id="sceneBarWrap">
    <div id="sceneTagsWrap"></div>
    <button id="sceneToggle" onclick="toggleSceneBar()">
      <span class="stoggle-arrow" id="stoggleArrow">▼</span>
    </button>
  </div>
</div>

<!-- ══ MAIN ══ -->
<main>

  <!-- Panel: 急救语句 -->
  <div class="panel on" id="panel-sos">
    <div id="banner"></div>
    <div class="content-wrap">
      <div id="loading">加载中…</div>
      <div id="content"></div>
    </div>
  </div>

  <!-- Panel: 日语学习 -->
  <div class="panel" id="panel-learn">
    <div class="ph">
      <div class="ph-icon">📖</div>
      <div class="ph-title">轻松日语学习</div>
      <div class="ph-desc">
        不是教科书，不考级。<br>
        用真实场景让你在不知不觉中熟悉日语。<br>
        每个场景一个对话剧本，演练一遍，下次不慌。
      </div>
      <span class="ph-badge">即将上线</span>
    </div>
  </div>

  <!-- Panel: 就医指南 -->
  <div class="panel" id="panel-medical">
    <div class="ph">
      <div class="ph-icon">🏥</div>
      <div class="ph-title">日本就医流程指南</div>
      <div class="ph-desc">
        从找医院到取药，<br>
        图文并茂一步一步带你走。<br>
        2026实用版，专为在日华人设计。
      </div>
      <span class="ph-badge">即将上线</span>
    </div>
  </div>

  <!-- Panel: 社区 -->
  <div class="panel" id="panel-community">
    <div class="ph">
      <div class="ph-icon">💬</div>
      <div class="ph-title">在日华人社区</div>
      <div class="ph-desc">
        分享经验，互相帮助。<br>
        在日生活遇到的问题，<br>
        这里都有人懂你。
      </div>
      <span class="ph-badge">敬请期待</span>
    </div>
  </div>

</main>

<!-- ══ CONTROLS BAR ══ -->
<div id="ctrlBar" style="display:none">
  <div class="ctrl-main">
    <button class="ctrl-play" onclick="speakAll()">▶ 朗读</button>
    <button class="ctrl-icon" id="btnPause" onclick="pauseOrResume()">⏸</button>
    <button class="ctrl-icon rd" id="btnStop" onclick="stopSpeech()">■</button>
    <button class="ctrl-icon" id="btnLoop" onclick="toggleLoop()">🔁</button>
    <button class="ctrl-icon sm-text" id="btnRuby" onclick="toggleRuby()">注音</button>
    <button class="ctrl-icon sm-text" onclick="showAll()">全部</button>
  </div>
  <div class="ctrl-settings" id="ctrlSettings"></div>
</div>

<!-- ══ TAB BAR ══ -->
<nav id="tabBar"></nav>

<button id="backTop" onclick="window.scrollTo({top:0,behavior:'smooth'})">
  <svg width="14" height="14" viewBox="0 0 24 24" fill="none"
       stroke="currentColor" stroke-width="2.5">
    <path d="M18 15l-6-6-6 6"/>
  </svg>
</button>
<div id="toast"></div>

<!-- ══ JS ══ -->
<script src="js/base.js"></script>
<script src="js/sos.js"></script>
<script>
/* ── Boot ── */
let CFG = {};
(async ()=>{
  try {
    const [cfg, icons] = await Promise.all([
      fetch('config.json').then(r=>r.json()),
      fetch('data/scene_icons.json').then(r=>r.json()),
    ]);
    CFG = cfg;
    renderTabBar(cfg);
    initVoices();
    await sosBoot(cfg, icons);
  } catch(e){
    console.error('Boot failed:', e);
    document.getElementById('loading').textContent = '加载失败，请刷新重试。';
  }
})();
</script>
</body>
</html>
